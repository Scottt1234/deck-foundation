<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Layers of Process Intelligence · Apromore × Salesforce</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    /* ───────────────────────────────────────────────────────────────
       The Layers of Process Intelligence — arrow-key walkthrough.
       Single-file, no external JS libraries. Built on the Salesforce
       2026 token palette (tokens.css), matching the deck's dark slides
       and the process-reality.html interaction model.

       Six slim layer cards (Process Mining → Monitor) sit above a
       full-width Conversational Interface pillar that underpins them
       all. Arrow keys step through 7 focus states; each one closes the
       previous large card and raises the next, with a reserved
       animation slot inside. Task Mining hosts the live "black box"
       animation; every other slot is a clean, swappable placeholder.
       ─────────────────────────────────────────────────────────────── */
    html, body { margin: 0; }
    html { height: 100%; }
    body {
      height: 100%; overflow: hidden;
      /* Match the deck's .sd slide background — same gradient stack used on every dark slide. */
      background:
        radial-gradient(80% 60% at 82% -4%, rgba(20,86,220,0.42), transparent 60%),
        radial-gradient(70% 60% at 4% 104%, rgba(10,60,200,0.32), transparent 60%),
        linear-gradient(165deg, #04102f 0%, #061d52 60%, #0a3aa0 130%);
      background-attachment: fixed;
      font-family: var(--font-body); color: #fff;
    }
    .hl { color: var(--sf-blue-l); }

    /* ── App shell: top (caption + rail) / bottom (big card stage) ── */
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; z-index: 1; }
    #top { flex: 0 0 auto; }
    #bottom { flex: 1 1 auto; position: relative; min-height: 0; padding: 4px 48px 84px; }

    /* ── Brand pill (hidden in embed mode — deck shows its own) ── */
    .brand {
      position: fixed; top: 26px; left: 30px; z-index: 8;
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.94); border-radius: 40px; padding: 7px 15px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.35);
    }
    .brand .nm { font-size: 12px; font-weight: 700; color: #5B3BD0; }
    .brand .x  { font-size: 13px; color: var(--gray-500); }
    .brand img { display: block; }
    body.embed .brand { display: none; }
    /* In the deck, the parent supplies slide dots, counter and prev/next arrows, and the
       active rail card signals the current layer — so hide our duplicate bottom chrome. */
    body.embed #nav, body.embed #progress { display: none; }

    /* ── Caption stack — mirrors process-reality.html / deck slide-body ── */
    /* top padding matches process-reality.html's caption (56px) — the higher of the
       deck's two patterns (foundation slide-body sits lower at 68px) — so an embedded
       slide 6 lines up with the process-reality slide it follows. */
    #caption { padding: 56px 48px 0; max-width: 1080px; margin: 0 auto; width: 100%; }
    #cap-eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--sf-blue-l); margin-bottom: 10px;
    }
    #cap-title {
      font-family: var(--font-body);
      font-size: clamp(26px, 3vw, 38px); font-weight: 700; line-height: 1.15;
      letter-spacing: -0.025em; color: #fff; margin: 0 0 12px;
    }
    #cap-sub {
      font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.66);
      max-width: 920px; margin: 0; min-height: 24px;
      transition: opacity 0.35s ease;
    }
    /* Caption bounce on every step transition — eyebrow, title and sub animate together,
       matching process-reality.html (only the caption bounces; cards/content do not). */
    @keyframes piTitleIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .cap-bounce { animation: piTitleIn 0.7s cubic-bezier(0,0,0.2,1) both; }

    /* ── Layer rail ── */
    #rail-wrap { max-width: 1080px; margin: 22px auto 0; padding: 0 48px; }
    #rail { display: flex; gap: 14px; align-items: stretch; }
    .pi-card {
      --c: #8fb8ff;
      flex: 1 1 0; min-width: 0; position: relative; cursor: pointer; text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
      border-top: 2px solid rgba(143,184,255,0.6);
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      padding: 10px 12px; opacity: 0.5;
      transition: opacity 0.35s ease, transform 0.2s ease,
                  box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .pi-card .pi-num {
      font-family: var(--font-display); font-size: 12px; font-weight: 700;
      letter-spacing: 0.08em; color: var(--sf-blue-l); opacity: 0.55;
    }
    /* card title — white, slightly larger (matches slide 3: blue number, white title) */
    .pi-card .pi-name { font-size: 16px; font-weight: 700; color: #fff; margin-top: 4px; line-height: 1.2; }
    .pi-card .pi-tag {
      display: inline-block; margin-top: 6px; font-size: 9px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; padding: 2px 8px;
    }
    /* flow connector between cards */
    .pi-card:not(:last-child)::after {
      content: '\203A'; position: absolute; right: -10px; top: 50%; transform: translateY(-50%);
      font-size: 18px; line-height: 1; font-weight: 400; color: rgba(255,255,255,0.35); z-index: 3;
    }
    .pi-card.active {
      opacity: 1; transform: translateY(-4px);
      border-color: rgba(143,184,255,0.5);
      border-top-color: rgba(143,184,255,0.85);
      background: rgba(143,184,255,0.08);
      box-shadow: 0 10px 24px -12px rgba(143,184,255,0.5);
    }
    .pi-card.done { opacity: 0.78; }

    /* ── Conversational Interface pillar (the foundation) ── */
    #pillar-wrap { max-width: 1080px; margin: 16px auto 0; padding: 0 48px; position: relative; }
    /* little bracket showing it underpins the rail above */
    #pillar-wrap::before {
      content: ''; position: absolute; left: 48px; right: 48px; top: -9px; height: 8px;
      border: 1px solid rgba(255,255,255,0.14); border-bottom: none; border-radius: 6px 6px 0 0;
      opacity: 0.6;
    }
    #pillar {
      --c: #8fb8ff; cursor: pointer; position: relative;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      border-top: 2px solid rgba(143,184,255,0.6);
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      padding: 9px 16px; opacity: 0.5;
      transition: opacity 0.35s ease, transform 0.2s ease,
                  box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    /* just the (centred, white) title — no number or tag */
    #pillar .pi-name { font-size: 16px; font-weight: 700; color: #fff; line-height: 1.2; text-align: center; }
    #pillar.active {
      opacity: 1; transform: translateY(-3px);
      border-color: rgba(143,184,255,0.5);
      border-top-color: rgba(143,184,255,0.85);
      background: rgba(143,184,255,0.08);
      box-shadow: 0 10px 24px -12px rgba(143,184,255,0.5);
    }

    /* ── Big animation card ── styled like the deck's slide-8 cards (clean & simple):
       flat fill, 1px border, 2px electric-blue top accent, no resting shadow. The
       electric-blue accent contrasts with the cloud-blue process cards above. */
    .pi-big {
      --c: #8fb8ff; position: absolute; inset: 24px 48px 84px;
      max-width: 944px; margin: 0 auto; left: 0; right: 0;
      display: flex; flex-direction: column;
      border: 1px solid rgba(255,255,255,0.12);
      border-top: 2px solid rgba(6,106,254,0.42);
      border-radius: 8px; overflow: hidden;
      background: rgba(255,255,255,0.05);
      opacity: 0; transform: translateY(46px) scale(0.985); pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.2,0.8,0.2,1),
                  transform 0.6s cubic-bezier(0.2,0.8,0.2,1);
    }
    .pi-big.active { opacity: 1; transform: none; pointer-events: auto; }
    .pi-big.closing { opacity: 0; transform: translateY(34px) scale(0.99); }

    .pi-big-head { flex: 0 0 auto; display: flex; align-items: center; gap: 16px; padding: 18px 24px 14px; }
    .pi-big-num {
      font-family: var(--font-display); font-size: 22px; font-weight: 700;
      color: var(--c); letter-spacing: 0.04em; line-height: 1;
    }
    .pi-big-headtext { flex: 1 1 auto; min-width: 0; }
    .pi-big-name { font-size: 19px; font-weight: 700; color: #fff; line-height: 1.15; }
    .pi-big-desc { font-size: 13px; color: rgba(255,255,255,0.66); line-height: 1.5; margin-top: 4px; max-width: 760px; }
    .pi-big-tag {
      flex: 0 0 auto; align-self: flex-start; font-size: 9.5px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--c);
      border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); border-radius: 999px; padding: 4px 11px;
    }

    /* animation slot fills the whole big card (no header/text) */
    .pi-big-stage {
      flex: 1 1 auto; min-height: 0; position: relative;
      margin: 12px; border-radius: 12px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Placeholder animation slot ── */
    .pi-slot {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; text-align: center;
      border: 1.5px dashed color-mix(in srgb, var(--c) 40%, rgba(255,255,255,0.18));
      border-radius: 12px;
      background:
        radial-gradient(60% 80% at 50% 45%, color-mix(in srgb, var(--c) 12%, transparent), transparent 70%),
        rgba(255,255,255,0.015);
    }
    .pi-slot-ic {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
      animation: slotPulse 2.6s ease-in-out infinite;
    }
    @keyframes slotPulse {
      0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 40%, transparent); }
      50%      { box-shadow: 0 0 0 12px transparent; }
    }
    .pi-slot-label { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.62); }
    .pi-slot-sub { font-size: 12px; color: rgba(255,255,255,0.42); font-style: italic; }

    /* ── Intro overlay (step 0) ── */
    #intro {
      position: absolute; inset: 24px 48px 84px; max-width: 944px; margin: 0 auto; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center; text-align: center;
      opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
    }
    #intro.show { opacity: 1; }
    #intro .pi-intro-card {
      border: 1px dashed rgba(255,255,255,0.22); border-radius: 16px;
      padding: 30px 40px; background: rgba(255,255,255,0.02); max-width: 620px;
    }
    #intro .pi-intro-h { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: #fff; }
    #intro .pi-intro-p { font-size: 13.5px; color: rgba(255,255,255,0.6); margin-top: 12px; line-height: 1.6; }
    #intro .pi-intro-key {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 20px;
      font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85);
    }
    #intro kbd {
      font-family: var(--font-body); font-size: 12px; font-weight: 700; color: #fff;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22);
      border-radius: 6px; padding: 3px 9px;
    }

    /* ── Bottom-left progress / bottom-right nav ── */
    #progress { position: fixed; left: 30px; bottom: 28px; z-index: 6; display: flex; align-items: center; gap: 14px; }
    #dots { display: flex; gap: 8px; }
    #dots .dot {
      width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.25);
      transition: background 0.3s ease, transform 0.3s ease;
    }
    #dots .dot.on { background: #8fb8ff; transform: scale(1.25); }
    #dots .dot.done { background: rgba(255,255,255,0.55); }
    #prog-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.5); }

    #nav { position: fixed; right: 30px; bottom: 24px; z-index: 6; display: flex; align-items: center; gap: 14px; }
    #nav .nav-count { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.55); font-variant-numeric: tabular-nums; }
    #nav button {
      appearance: none; cursor: pointer; width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.28); color: #fff;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease, opacity 0.18s ease;
    }
    #nav button:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.5); }
    #nav button:active { transform: scale(0.94); }
    #nav button:disabled { opacity: 0.3; cursor: default; }

    /* ═══════════ Task Mining animation — siloed systems → unified ═══════════
       Adapted/expanded from blackbox-preview.html. Fills the whole big-card
       stage: a sealed cover dissolves to reveal six siloed system windows,
       which then stream their data along connectors into one unified hub.
       Scoped under .bb-scene; trigger by toggling .playing. */
    .bb-scene { position: relative; width: 100%; height: 100%; }
    .bb-stage {
      position: relative; width: 100%; height: 100%; border-radius: 6px; overflow: hidden;
    }
    .bb-inside {
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.05)),
        radial-gradient(50% 60% at 50% 50%, rgba(20,86,220,0.22), transparent 70%);
    }
    .win {
      position: absolute; border-radius: 7px; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(3px);
      opacity: 0; transform: translateY(10px) scale(0.97);
    }
    .win-bar {
      height: 20px; border-radius: 6px 6px 0 0; display: flex; align-items: center;
      padding: 0 9px; gap: 5px; background: rgba(255,255,255,0.10);
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }
    .win-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.35); }
    .win-dot:nth-child(1) { background: rgba(255,120,120,0.6); }
    .win-dot:nth-child(2) { background: rgba(255,200,90,0.55); }
    .win-dot:nth-child(3) { background: rgba(120,220,160,0.55); }
    .win-title { font-size: 11px; color: rgba(255,255,255,0.82); margin-left: 7px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .win-body { padding: 11px 11px 12px; display: flex; flex-direction: column; gap: 6px; }
    .win-line { height: 5px; border-radius: 2px; background: rgba(255,255,255,0.14); }
    .win-line.short   { width: 60%; }
    .win-line.shorter { width: 40%; }
    .win-line.long    { width: 90%; }
    /* six siloed systems spread across the full stage */
    .win-pega       { top:  6%; left:  3%; width: 28%; height: 30%; }
    .win-guidewire  { top:  5%; left: 36%; width: 28%; height: 26%; }
    .win-outlook    { top:  7%; left: 69%; width: 28%; height: 31%; }
    .win-excel      { top: 64%; left:  3%; width: 28%; height: 30%; }
    .win-sharepoint { top: 70%; left: 36%; width: 28%; height: 25%; }
    .win-portal     { top: 63%; left: 69%; width: 28%; height: 31%; }

    /* connectors + unified hub (SVG fills the stage) */
    .bb-flow { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
    .bb-flow svg { width: 100%; height: 100%; display: block; }
    .bb-flow .flow-line { stroke: #8fb8ff; stroke-width: 1.4; fill: none; stroke-dasharray: 5 6; opacity: 0.5; }
    .bb-flow .flow-node { fill: #8fb8ff; opacity: 0.85; }
    .bb-flow .flow-dot  { fill: #dbecff; opacity: 0.95; }
    .bb-hub-ring  { fill: none; stroke: #8fb8ff; stroke-width: 1.5; }
    .bb-hub-glow  { fill: rgba(143,184,255,0.16); }
    .bb-hub-core  { fill: #e6f1ff; }
    .bb-hub-edge  { fill: none; stroke: #8fb8ff; stroke-width: 1.5; opacity: 0.85; }

    .bb-cover {
      position: absolute; inset: 0; z-index: 5;
      background: radial-gradient(80% 60% at 50% 50%, #0a1830 0%, #04102f 100%);
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    }
    .bb-cover::before {
      content: ''; position: absolute; inset: 14px; border: 1.5px dashed rgba(143,184,255,0.32);
      border-radius: 10px; pointer-events: none;
    }
    .bb-cover-icon {
      width: 72px; height: 72px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(143,184,255,0.10); color: #8fb8ff; border: 1px solid rgba(143,184,255,0.4);
    }
    .bb-cover-label { font-size: 14px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.62); }
    .bb-cover-sub { font-size: 12px; color: rgba(255,255,255,0.44); margin-top: -6px; letter-spacing: 0.04em; font-style: italic; }

    @keyframes bbCoverFade { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.03); } }
    @keyframes bbWinPop { 0% { opacity: 0; transform: translateY(10px) scale(0.97); } 100% { opacity: 1; transform: none; } }
    @keyframes bbFlowIn { to { opacity: 1; } }
    .bb-scene.playing .bb-cover       { animation: bbCoverFade 1.0s 0.8s cubic-bezier(0.4,0,0.2,1) forwards; }
    .bb-scene.playing .win-pega       { animation: bbWinPop 0.5s 1.40s cubic-bezier(0.22,1,0.36,1) forwards; }
    .bb-scene.playing .win-guidewire  { animation: bbWinPop 0.5s 1.55s cubic-bezier(0.22,1,0.36,1) forwards; }
    .bb-scene.playing .win-outlook    { animation: bbWinPop 0.5s 1.70s cubic-bezier(0.22,1,0.36,1) forwards; }
    .bb-scene.playing .win-excel      { animation: bbWinPop 0.5s 1.85s cubic-bezier(0.22,1,0.36,1) forwards; }
    .bb-scene.playing .win-sharepoint { animation: bbWinPop 0.5s 2.00s cubic-bezier(0.22,1,0.36,1) forwards; }
    .bb-scene.playing .win-portal     { animation: bbWinPop 0.5s 2.15s cubic-bezier(0.22,1,0.36,1) forwards; }
    .bb-scene.playing .bb-flow        { animation: bbFlowIn 0.8s 2.70s ease forwards; }

    @media (prefers-reduced-motion: reduce) {
      .bb-scene .bb-cover { opacity: 0 !important; animation: none !important; }
      .bb-scene .win { opacity: 1 !important; transform: none !important; animation: none !important; }
      .bb-scene .bb-flow { opacity: 1 !important; animation: none !important; }
    }

    /* ═══════════ Conversational Interface animation — the few → the many ═══════════
       Narrated: "It used to take an expert" → two experts → they shrink into an organic
       whole-org crowd as "Now anyone can ask." types; then "In their own words." + questions. */
    .cv-scene { position: absolute; inset: 0; display: flex; }
    .cv-people { position: relative; flex: 1.7 1 0; overflow: hidden; }
    .cv-questions { position: relative; flex: 1.2 1 0; min-width: 0; display: flex; flex-direction: column;
      justify-content: flex-end; border-left: 1px solid rgba(255,255,255,0.10); padding: 16px; }
    .cv-qlist { display: flex; flex-direction: column; justify-content: flex-end; gap: 9px; }

    /* typed narration lines — left (cv-narrate) and right (cv-rtitle), same font + size */
    .cv-narrate, .cv-rtitle { font-family: var(--font-display); font-weight: 700;
      font-size: clamp(17px, 2.4vw, 25px); letter-spacing: -0.01em; line-height: 1.25; color: #fff; }
    .cv-narrate { position: absolute; top: 8%; left: 6%; right: 6%; white-space: nowrap; }
    .cv-narrate.wipe { clip-path: inset(0 0 0 0); animation: cvWipe 0.77s ease forwards; }
    .cv-rtitle { position: absolute; top: 8%; left: 16px; right: 16px; color: var(--sf-blue-l); }
    .cv-hl { color: var(--sf-blue-l); }
    .cv-caret { display: inline-block; width: 2px; height: 1em; background: var(--sf-blue-l);
      margin-left: 2px; vertical-align: -2px; animation: cvBlink 1s step-end infinite; }

    /* crowd cloud (organic, absolute positions set inline) */
    .cv-crowd { position: absolute; inset: 24% 4% 5% 4%; }
    .cv-dot, .cv-hero-ic { position: absolute; width: 9.6%; aspect-ratio: 1; transform: translate(-50%,-50%); }
    .cv-dot svg, .cv-hero-ic svg { width: 100%; height: 100%; display: block; fill: currentColor; }
    .cv-dot { color: #cdd6e1; opacity: 0; }                           /* the wider org — slightly grey so it doesn't clash with the white text */
    .cv-dot svg { animation: cvFloat 3s ease-in-out infinite; animation-delay: calc(var(--d,0) * 1s); }
    .cv-scene.revealed .cv-dot { animation: cvFade 1.1s calc(var(--i,0) * 0.05s) ease forwards; }   /* slow fade-in */

    /* the two experts — appear large & centred (.experts), then slowly fly in & shrink (.revealed) */
    .cv-hero-ic { color: var(--sf-blue-l); opacity: 0; z-index: 4;
      filter: drop-shadow(0 0 12px rgba(0,179,255,0.6));
      transform: translate(-50%,-50%) translate(var(--sx,0), var(--sy,0)) scale(var(--hs,4.2));
      transition: transform 2.5s cubic-bezier(0.4,0,0.2,1), opacity 0.9s ease; }
    .cv-scene.experts .cv-hero-ic { opacity: 1; }
    .cv-scene.revealed .cv-hero-ic { transform: translate(-50%,-50%) scale(1); }
    .cv-scene.revealed .cv-hero-ic svg { animation: cvFloat 3s ease-in-out infinite; }

    /* question bubbles (one size larger) */
    .cv-q { position: relative; align-self: flex-start; max-width: 100%;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px 12px 12px 4px; padding: 10px 13px; font-size: 13.5px; line-height: 1.4;
      color: #fff; animation: cvQIn 0.4s cubic-bezier(0.22,1,0.36,1) both; }
    .cv-q .cv-tick { display: inline-block; margin-left: 6px; color: #04E1CB; font-weight: 700; opacity: 0; transition: opacity 0.3s ease; }
    .cv-q.answered .cv-tick { opacity: 1; }

    @keyframes cvFloat { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(1.5px,-5px); } 50% { transform: translate(0,-9px); } 75% { transform: translate(-1.5px,-4px); } }
    @keyframes cvFade  { from { opacity: 0; transform: translate(-50%,-50%) scale(0.7); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
    @keyframes cvWipe  { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 0 0 100%); } }
    @keyframes cvQIn   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes cvBlink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .cv-scene .cv-dot { opacity: 1 !important; transform: translate(-50%,-50%) !important; animation: none !important; }
      .cv-scene .cv-dot svg { animation: none !important; }
      .cv-scene .cv-hero-ic { opacity: 1 !important; transform: translate(-50%,-50%) scale(1) !important; transition: none !important; }
      .cv-narrate.wipe { animation: none !important; }
    }

    /* ── Responsive ── */
    @media (max-width: 1000px) {
      #rail { flex-wrap: wrap; }
      .pi-card { flex: 1 1 28%; }
      .pi-card:not(:last-child)::after { display: none; }
    }
    @media (max-width: 720px) {
      #bottom, .pi-big, #intro { padding-left: 18px; padding-right: 18px; }
      .pi-big { inset: 24px 18px 84px; }
      #intro { inset: 24px 18px 84px; }
      #caption, #rail-wrap, #pillar-wrap { padding-left: 18px; padding-right: 18px; }
    }
  </style>

<body>

<script>
(() => {
  'use strict';

  // ── Layer data ─────────────────────────────────────────────────
  // Each layer becomes a rail card + a big card. `anim:'blackbox'` mounts the
  // live Task Mining animation; everything else gets a swappable placeholder.
  const LAYERS = [
    { num:'01', name:'Process Mining',  tag:'System',  color:'#8fb8ff',
      sub:'See how the process really runs &mdash; not how the diagram on the wall says it should.',
      desc:'Reconstructs how a process actually runs inside a system from event logs &mdash; every variant, bottleneck and rework loop.' },
    { num:'02', name:'Task Mining',     tag:'Desktop', color:'#8fb8ff', anim:'blackbox',
      sub:'See the work <em>between</em> the systems &mdash; where process mining goes blind.',
      desc:'Captures the work between systems at the desktop &mdash; the rate look-ups, broker emails and manual referrals process mining alone cannot see.' },
    { num:'03', name:'Analysis',        tag:'Insight', color:'#8fb8ff',
      sub:'Put a number on the waste &mdash; and on the prize.',
      desc:'Quantifies the cost of inefficiency and the value of recoverable waste, turning observation into a business case.' },
    { num:'04', name:'Recommendation',  tag:'AI',      color:'#8fb8ff',
      sub:'From problem to the specific fix &mdash; proposed by AI.',
      desc:'AI proposes the specific change to make &mdash; not just the problem, but the mechanism that fixes it.' },
    { num:'05', name:'Simulation',      tag:'Proof',   color:'#8fb8ff',
      sub:'Prove the change works <em>before</em> you make it.',
      desc:'Validates the recommendation before you commit, modelling the impact across cost, time and risk.' },
    { num:'06', name:'Monitor',         tag:'Live',    color:'#8fb8ff',
      sub:'Keep it fixed &mdash; watch the process live and catch drift the moment it appears.',
      desc:'Watches the process in production, confirming the change held and catching drift the moment it appears.' },
  ];
  const FOUNDATION = { num:'07', name:'Conversational Interface', tag:'Underpins all', color:'#8fb8ff', anim:'convo',
    sub:'Ask anything in plain English &mdash; the layer that underpins them all.',
    desc:'The layer that underpins every other: ask any question in plain English and get an evidence-backed answer drawn from all six layers above.' };

  const STEPS = LAYERS.length + 1;            // 6 layers + conversational interface
  const ALL = LAYERS.concat([FOUNDATION]);    // index aligned with focus steps 1..7

  // ── Task Mining animation markup (siloed systems → unified hub) ─
  // Helper: a "system" window with a title bar + a few content lines.
  const win = (cls, title, lines) => `
    <div class="win ${cls}">
      <div class="win-bar"><div class="win-dot"></div><div class="win-dot"></div><div class="win-dot"></div><span class="win-title">${title}</span></div>
      <div class="win-body">${lines.map(c => `<div class="win-line ${c}"></div>`).join('')}</div>
    </div>`;
  // Helper: one connector from a window centre into the hub, with two streaming dots.
  const conn = (x, y, b1, b2) => {
    const d = `M${x},${y} L500,280`;
    return `
      <path class="flow-line" d="${d}" />
      <circle class="flow-node" cx="${x}" cy="${y}" r="3.5" />
      <circle class="flow-dot" r="3.4"><animateMotion dur="2.4s" begin="${b1}s" repeatCount="indefinite" path="${d}" /></circle>
      <circle class="flow-dot" r="3.4"><animateMotion dur="2.4s" begin="${b2}s" repeatCount="indefinite" path="${d}" /></circle>`;
  };
  const BLACKBOX = `
    <div class="bb-scene">
      <div class="bb-stage">
        <div class="bb-inside" aria-hidden="true">
          ${win('win-pega',       'Pega · QW Commercial',   ['long','short','','shorter'])}
          ${win('win-guidewire',  'Guidewire · Policy',     ['short','long','shorter'])}
          ${win('win-outlook',    'Outlook · Broker thread',['','short','long','shorter'])}
          ${win('win-excel',      'Rate calc.xlsx',         ['short','','shorter'])}
          ${win('win-sharepoint', 'SharePoint · Docs',      ['long','short'])}
          ${win('win-portal',     'Broker portal',          ['short','shorter','long'])}
        </div>
        <div class="bb-flow" aria-hidden="true">
          <svg viewBox="0 0 1000 560" preserveAspectRatio="none">
            ${conn(170,118,0.0,1.2)}
            ${conn(500,101,0.3,1.5)}
            ${conn(830,126,0.6,1.8)}
            ${conn(170,442,0.15,1.35)}
            ${conn(500,462,0.45,1.65)}
            ${conn(830,440,0.75,1.95)}
            <g class="bb-hub">
              <circle class="bb-hub-glow" cx="500" cy="280" r="28">
                <animate attributeName="r" values="24;36;24" dur="3s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="0.55;0.12;0.55" dur="3s" repeatCount="indefinite" />
              </circle>
              <circle class="bb-hub-ring" cx="500" cy="280" r="22" />
              <circle class="bb-hub-core" cx="500" cy="280" r="11" />
              <circle class="bb-hub-edge" cx="500" cy="280" r="11" />
            </g>
          </svg>
        </div>
        <div class="bb-cover">
          <div class="bb-cover-icon">
            <svg width="36" height="36" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="6" width="24" height="20" rx="2"/><path d="M4 12h24"/>
              <circle cx="8" cy="9" r="1" fill="currentColor" stroke="none"/><circle cx="11" cy="9" r="1" fill="currentColor" stroke="none"/>
              <path d="M11 18h10M11 22h6"/>
            </svg>
          </div>
          <div class="bb-cover-label">The Workstation</div>
          <div class="bb-cover-sub">where the work between siloed systems happens</div>
        </div>
      </div>
    </div>`;

  // Placeholder slot — no title or copy, just a centred marker (swap in the real animation later).
  const placeholderSlot = () => `
    <div class="pi-slot">
      <div class="pi-slot-ic">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>
      </div>
    </div>`;

  // ── Conversational Interface animation (the few → the many) ─────
  // Left 2/3: two "Data scientists" shrink away as a whole-organisation crowd pops in
  // ("Every team"). Right 1/3: broad, plain-English questions stream in and get answered.
  const CONVO_QUESTIONS = [
    'How can I reduce call handling time?',
    "Where's the bottleneck in onboarding?",
    "What's driving claims rework this quarter?",
    'Which process costs us the most?',
    'How do I speed up new-policy approvals?',
    'Where are customers dropping off?',
    "What's slowing down our invoicing?",
  ];
  const personSVG = () => '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.2" r="4"/><path d="M3.6 20.5c0-4.64 3.76-8 8.4-8s8.4 3.36 8.4 8z"/></svg>';

  function buildConvo() {
    const scene = document.createElement('div');
    scene.className = 'cv-scene';
    scene.innerHTML = `
      <div class="cv-people">
        <div class="cv-narrate"></div>
        <div class="cv-crowd"></div>
      </div>
      <div class="cv-questions">
        <div class="cv-rtitle"></div>
        <div class="cv-qlist"></div>
      </div>`;
    const crowd = scene.querySelector('.cv-crowd');
    // Seeded RNG → a stable, organic cloud (not a grid).
    let s = 20260607;
    const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    // Place points in an ellipse. AR corrects for the crowd box being wider than tall, so the
    // spacing test is roughly uniform in pixels (prevents vertical stacking / clipping).
    const N = 30, RX = 48, RY = 47, AR = 2.2, MIND = 10, pts = [];
    let guard = 0;
    while (pts.length < N && guard++ < 9000) {
      const x = 50 + (rnd() * 2 - 1) * RX;
      const y = 50 + (rnd() * 2 - 1) * RY;
      if (((x - 50) / RX) ** 2 + ((y - 50) / RY) ** 2 > 1) continue;     // inside an ellipse
      if (pts.some(p => Math.hypot(p.x - x, (p.y - y) / AR) < MIND)) continue;   // aspect-aware spacing
      pts.push({ x, y });
    }
    // Two experts = the points nearest the centre (so they sit in the heart of the crowd).
    pts.sort((a, b) => Math.hypot(a.x - 50, a.y - 50) - Math.hypot(b.x - 50, b.y - 50));
    pts.forEach((p, i) => {
      const isExpert = i < 2;
      const el = document.createElement('span');
      el.className = isExpert ? 'cv-hero-ic' : 'cv-dot';
      el.style.left = p.x + '%';
      el.style.top = p.y + '%';
      if (!isExpert) { el.style.setProperty('--i', i); el.style.setProperty('--d', (rnd() * 1.4).toFixed(2)); }
      el.innerHTML = personSVG();
      crowd.appendChild(el);
    });
    return scene;
  }

  // ── Build rail + pillar ────────────────────────────────────────
  const rail = document.getElementById('rail');
  LAYERS.forEach((l, i) => {
    const el = document.createElement('div');
    el.className = 'pi-card'; el.style.setProperty('--c', l.color); el.dataset.step = i + 1;
    el.innerHTML = `<div class="pi-num">${l.num}</div><div class="pi-name">${l.name}</div>`;
    el.addEventListener('click', () => goTo(i + 1));
    rail.appendChild(el);
  });
  const railCards = Array.from(rail.children);

  const pillar = document.getElementById('pillar');
  pillar.dataset.step = STEPS;
  // Just the title — no number, no tag.
  pillar.innerHTML = `<div class="pi-name">${FOUNDATION.name}</div>`;
  pillar.addEventListener('click', () => goTo(STEPS));

  // ── Build big cards ────────────────────────────────────────────
  const bottom = document.getElementById('bottom');
  const bigs = [];
  ALL.forEach((l) => {
    const el = document.createElement('div');
    el.className = 'pi-big'; el.style.setProperty('--c', l.color);
    // No header/text — the whole card is the animation slot.
    const stage = document.createElement('div'); stage.className = 'pi-big-stage';
    if (l.anim === 'blackbox')   stage.innerHTML = BLACKBOX;
    else if (l.anim === 'convo') stage.appendChild(buildConvo());
    else                         stage.innerHTML = placeholderSlot();
    el.appendChild(stage);
    bottom.appendChild(el);
    bigs.push(el);
  });

  // ── Progress dots ──────────────────────────────────────────────
  const dotsWrap = document.getElementById('dots');
  for (let i = 0; i < STEPS; i++) { const d = document.createElement('div'); d.className = 'dot'; dotsWrap.appendChild(d); }
  const dots = Array.from(dotsWrap.children);
  const intro = document.getElementById('intro');
  const capEyebrow = document.getElementById('cap-eyebrow');
  const capTitle = document.getElementById('cap-title');
  const capSub = document.getElementById('cap-sub');
  const progLabel = document.getElementById('prog-label');
  const navCount = document.getElementById('nav-count');
  const btnPrev = document.getElementById('prev');
  const btnNext = document.getElementById('next');
  const btnReplay = document.getElementById('replay');

  // ── Navigation state ───────────────────────────────────────────
  let step = 0;            // 0 = overview; 1..STEPS = focus a layer / pillar
  let currentBig = null;
  let swapTimer = null;

  const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function playBlackbox(el) {
    const scene = el.querySelector('.bb-scene');
    if (!scene) return;
    scene.classList.remove('playing');
    void scene.offsetWidth;                 // reflow so the timeline re-fires
    scene.classList.add('playing');
  }

  // ── Conversational Interface: play people animation + stream questions ──
  function stopConvoQuestions(scene) {
    if (scene._qTimers) { scene._qTimers.forEach(clearTimeout); scene._qTimers = null; }
    const list = scene.querySelector('.cv-qlist'); if (list) list.innerHTML = '';
  }
  function startConvoQuestions(scene) {
    stopConvoQuestions(scene);
    const list = scene.querySelector('.cv-qlist'); if (!list) return;
    const timers = []; scene._qTimers = timers;
    let qi = 0;
    const addBubble = () => {
      const b = document.createElement('div'); b.className = 'cv-q';
      const txt = document.createElement('span'); b.appendChild(txt);
      list.appendChild(b);
      while (list.children.length > 4) list.removeChild(list.firstChild);   // keep it a rolling feed
      const q = CONVO_QUESTIONS[qi++ % CONVO_QUESTIONS.length];
      if (reduceMotion()) {
        txt.textContent = q;
        const tick = document.createElement('span'); tick.className = 'cv-tick'; tick.textContent = '✓'; b.appendChild(tick);
        b.classList.add('answered');
        timers.push(setTimeout(addBubble, 2200));
        return;
      }
      const caret = document.createElement('span'); caret.className = 'cv-caret'; b.appendChild(caret);
      let ci = 0;
      const type = () => {
        txt.textContent = q.slice(0, ci++);
        if (ci <= q.length) { timers.push(setTimeout(type, 36)); }
        else {
          caret.remove();
          const tick = document.createElement('span'); tick.className = 'cv-tick'; tick.textContent = '✓'; b.appendChild(tick);
          timers.push(setTimeout(() => b.classList.add('answered'), 220));
          timers.push(setTimeout(addBubble, 1500));
        }
      };
      type();
    };
    timers.push(setTimeout(addBubble, 150));   // narration has already played; begin promptly
  }
  // Typewriter for a narration line. `segments` = [{t, hl?}] so part of a line can be coloured.
  function typeLine(scene, host, segments, cps, onDone) {
    host.innerHTML = '';
    const spans = segments.map(s => { const e = document.createElement('span'); if (s.hl) e.className = 'cv-hl'; host.appendChild(e); return e; });
    if (reduceMotion()) { spans.forEach((e, i) => e.textContent = segments[i].t); onDone && onDone(); return; }
    const caret = document.createElement('span'); caret.className = 'cv-caret'; host.appendChild(caret);
    let si = 0, ci = 0;
    const stepFn = () => {
      if (si >= segments.length) { caret.remove(); onDone && onDone(); return; }
      const seg = segments[si];
      if (ci < seg.t.length) spans[si].textContent += seg.t[ci++];
      else { si++; ci = 0; }
      scene._cvTimers.push(setTimeout(stepFn, cps));
    };
    stepFn();
  }

  function playConvo(el) {
    const scene = el.querySelector('.cv-scene'); if (!scene) return;
    if (scene._cvTimers) scene._cvTimers.forEach(clearTimeout);
    scene._cvTimers = [];
    stopConvoQuestions(scene);
    scene.classList.remove('playing', 'experts', 'revealed');
    const narrate = scene.querySelector('.cv-narrate');
    const rtitle = scene.querySelector('.cv-rtitle');
    narrate.classList.remove('wipe'); narrate.innerHTML = ''; rtitle.innerHTML = '';

    // Frame the two experts as a side-by-side pair at the panel centre. Reset --sx/--sy to 0
    // first so the measurement isn't thrown off by the previous play's offsets (replay fix).
    const heroes = scene.querySelectorAll('.cv-hero-ic');
    const people = scene.querySelector('.cv-people');
    heroes.forEach(h => { h.style.transition = 'none'; h.style.setProperty('--sx', '0px'); h.style.setProperty('--sy', '0px'); });
    void scene.offsetWidth;
    const pr = people.getBoundingClientRect();
    const cx = pr.left + pr.width / 2, cy = pr.top + pr.height * 0.58;
    heroes.forEach((h, k) => {
      const r = h.getBoundingClientRect();
      const off = (k === 0 ? -1 : 1) * r.width * 0.52;   // spacing scales with the (large) start size
      h.style.setProperty('--sx', (cx - (r.left + r.width / 2) + off) + 'px');
      h.style.setProperty('--sy', (cy - (r.top + r.height / 2)) + 'px');
    });
    void scene.offsetWidth;                              // commit placement before re-enabling transition
    heroes.forEach(h => { h.style.transition = ''; });

    scene.classList.add('playing');                      // blank stage
    const CPS = 67;                                       // ~40% slower typing
    const T = (fn, ms) => scene._cvTimers.push(setTimeout(fn, ms));

    // 1) "It used to take an expert" types on the left; experts appear once it finishes.
    typeLine(scene, narrate, [{ t: 'It used to take an ' }, { t: 'expert', hl: true }], CPS, () => scene.classList.add('experts'));
    // 2) hold (a second longer), then wipe the line away.
    T(() => narrate.classList.add('wipe'), 4800);
    // 3) experts slowly shrink + crowd slowly fades in, while "Now anyone can ask for anything" types.
    T(() => {
      narrate.classList.remove('wipe'); narrate.innerHTML = '';
      scene.classList.add('revealed');
      typeLine(scene, narrate, [{ t: 'Now anyone can ask for anything.' }], CPS);
    }, 5650);
    // 4) after a pause, "In their own words." types on the right (light blue).
    T(() => typeLine(scene, rtitle, [{ t: 'In their own words.' }], CPS), 8600);
    // 5) then the questions stream in.
    T(() => startConvoQuestions(scene), 10100);
  }
  function stopConvo(el) {
    const scene = el.querySelector('.cv-scene'); if (!scene) return;
    if (scene._cvTimers) { scene._cvTimers.forEach(clearTimeout); scene._cvTimers = null; }
    stopConvoQuestions(scene);
    const narrate = scene.querySelector('.cv-narrate'); if (narrate) { narrate.classList.remove('wipe'); narrate.innerHTML = ''; }
    const rtitle = scene.querySelector('.cv-rtitle'); if (rtitle) rtitle.innerHTML = '';
    scene.classList.remove('playing', 'experts', 'revealed');
  }

  function showBig(n) {
    const next = (n >= 1 && n <= STEPS) ? bigs[n - 1] : null;
    if (next === currentBig) return;
    const prev = currentBig;
    currentBig = next;
    if (swapTimer) { clearTimeout(swapTimer); swapTimer = null; }
    if (prev) {
      prev.classList.remove('active'); prev.classList.add('closing');
      if (prev.querySelector('.cv-scene')) stopConvo(prev);   // halt question timers immediately
    }
    const delay = prev ? 280 : 0;           // close the last card, then raise the new one
    swapTimer = setTimeout(() => {
      if (prev) prev.classList.remove('closing');
      if (next) {
        next.classList.add('active');
        if (next.querySelector('.bb-scene')) playBlackbox(next);
        else if (next.querySelector('.cv-scene')) playConvo(next);
      }
    }, delay);
  }

  // Replay the animation in the currently-open card (driven by the in-iframe replay
  // button and the deck's replay button via the 'replay' message).
  function replayCurrent() {
    const el = currentBig; if (!el) return;
    if (el.querySelector('.bb-scene')) playBlackbox(el);
    else if (el.querySelector('.cv-scene')) playConvo(el);
  }

  function render() {
    // rail + pillar highlight
    railCards.forEach((c, i) => {
      c.classList.toggle('active', step === i + 1);
      c.classList.toggle('done', step > i + 1);
    });
    pillar.classList.toggle('active', step === STEPS);

    // big card / intro
    showBig(step);
    intro.classList.toggle('show', step === 0);

    // caption: set the sub text, then bounce eyebrow + title + sub together
    capSub.innerHTML = step === 0
      ? 'Six layers of process intelligence &mdash; underpinned by a conversational interface anyone can use.'
      : ALL[step - 1].sub;
    const capEls = [capEyebrow, capTitle, capSub];
    capEls.forEach(el => el.classList.remove('cap-bounce'));
    void capTitle.offsetWidth;                 // single reflow to re-fire the animation
    capEls.forEach(el => el.classList.add('cap-bounce'));

    // progress
    dots.forEach((d, i) => { d.classList.toggle('on', step === i + 1); d.classList.toggle('done', step > i + 1); });
    progLabel.textContent = step === 0 ? 'Overview' : ALL[step - 1].name;
    navCount.textContent = step + ' / ' + STEPS;
    btnPrev.disabled = step === 0;
    btnNext.disabled = step === STEPS;
  }

  function goTo(n) {
    n = Math.max(0, Math.min(STEPS, n));
    if (n === step) return;
    step = n;
    render();
  }

  btnPrev.addEventListener('click', () => goTo(step - 1));
  btnNext.addEventListener('click', () => goTo(step + 1));
  btnReplay.addEventListener('click', replayCurrent);

  // ── Keyboard + deck bridge ─────────────────────────────────────
  // Embedded in the deck (foundation.html), this file OWNS its own step sequence. The deck
  // sends intent only — deck-enter / deck-advance / deck-reverse — and we reply deck-next /
  // deck-prev when stepping past the first/last step so the deck changes slides. Because the
  // step count lives here, layers can be added/removed without touching the deck.
  const embedded = window.parent !== window;
  const toParent = (msg) => { try { window.parent.postMessage(msg, '*'); } catch (err) {} };
  const isArrowKey = k => k === 'ArrowRight' || k === 'ArrowLeft' || k === 'ArrowDown' || k === 'ArrowUp';
  const isFwdKey   = k => k === 'ArrowRight' || k === 'ArrowDown';

  function stepForward()  { if (step < STEPS) goTo(step + 1); else if (embedded) toParent({ type: 'deck-next' }); }
  function stepBackward() { if (step > 0)     goTo(step - 1); else if (embedded) toParent({ type: 'deck-prev' }); }

  // Local arrow keys — used standalone, and when the iframe itself holds focus inside the deck.
  window.addEventListener('keydown', (e) => {
    if (!isArrowKey(e.key)) return;
    e.preventDefault();
    isFwdKey(e.key) ? stepForward() : stepBackward();
  });

  // Parent → iframe messages (the deck's embed handshake):
  window.addEventListener('message', (e) => {
    if (!e.data) return;
    switch (e.data.type) {
      // Entered the slide (fwd/reverse). Set the step and ALWAYS render so the title
      // bounces on entry too — goTo() would no-op if the step index is unchanged.
      case 'deck-enter':       step = (e.data.dir === 'rev') ? STEPS : 0; render(); break;
      case 'deck-advance':     stepForward();  break;
      case 'deck-reverse':     stepBackward(); break;
      case 'replay':           replayCurrent(); break;     // deck replay button
      case 'slide-activated':  step = 0; render(); break;  // legacy reset hook
    }
  });

  // ── Boot ───────────────────────────────────────────────────────
  render();
  // Tell the deck we're ready so it can (re)send deck-enter if it navigated here before load.
  if (embedded) toParent({ type: 'embed-ready' });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Layers of Process Intelligence · Apromore × Salesforce</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    /* ───────────────────────────────────────────────────────────────
       The Layers of Process Intelligence — arrow-key walkthrough.
       Single-file, no external JS libraries. Built on the Salesforce
       2026 token palette (tokens.css), matching the deck's dark slides
       and the process-reality.html interaction model.

       Six slim layer cards (Process Mining → Monitor) sit above a
       full-width Conversational Interface pillar that underpins them
       all. Arrow keys step through 7 focus states; each one closes the
       previous large card and raises the next, with a reserved
       animation slot inside. Task Mining hosts the live "black box"
       animation; every other slot is a clean, swappable placeholder.
       ─────────────────────────────────────────────────────────────── */
    html, body { margin: 0; }
    html { height: 100%; }
    body {
      height: 100%; overflow: hidden;
      /* Match the deck's .sd slide background — same gradient stack used on every dark slide. */
      background:
        radial-gradient(80% 60% at 82% -4%, rgba(20,86,220,0.42), transparent 60%),
        radial-gradient(70% 60% at 4% 104%, rgba(10,60,200,0.32), transparent 60%),
        linear-gradient(165deg, #04102f 0%, #061d52 60%, #0a3aa0 130%);
      background-attachment: fixed;
      font-family: var(--font-body); color: #fff;
    }
    .hl { color: var(--sf-blue-l); }

    /* ── App shell: top (caption + rail) / bottom (big card stage) ── */
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; z-index: 1; }
    #top { flex: 0 0 auto; }
    #bottom { flex: 1 1 auto; position: relative; min-height: 0; padding: 4px 48px 84px; }

    /* ── Brand pill (hidden in embed mode — deck shows its own) ── */
    .brand {
      position: fixed; top: 26px; left: 30px; z-index: 8;
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.94); border-radius: 40px; padding: 7px 15px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.35);
    }
    .brand .nm { font-size: 12px; font-weight: 700; color: #5B3BD0; }
    .brand .x  { font-size: 13px; color: var(--gray-500); }
    .brand img { display: block; }
    body.embed .brand { display: none; }
    /* In the deck, the parent supplies slide dots, counter and prev/next arrows, and the
       active rail card signals the current layer — so hide our duplicate bottom chrome. */
    body.embed #nav, body.embed #progress { display: none; }

    /* ── Caption stack — mirrors process-reality.html / deck slide-body ── */
    /* top padding matches process-reality.html's caption (56px) — the higher of the
       deck's two patterns (foundation slide-body sits lower at 68px) — so an embedded
       slide 6 lines up with the process-reality slide it follows. */
    #caption { padding: 56px 48px 0; max-width: 1080px; margin: 0 auto; width: 100%; }
    #cap-eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--sf-blue-l); margin-bottom: 10px;
    }
    #cap-title {
      font-family: var(--font-body);
      font-size: clamp(26px, 3vw, 38px); font-weight: 700; line-height: 1.15;
      letter-spacing: -0.025em; color: #fff; margin: 0 0 12px;
    }
    #cap-sub {
      font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.66);
      max-width: 920px; margin: 0; min-height: 24px;
      transition: opacity 0.35s ease;
    }
    /* Caption bounce on every step transition — eyebrow, title and sub animate together,
       matching process-reality.html (only the caption bounces; cards/content do not). */
    @keyframes piTitleIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .cap-bounce { animation: piTitleIn 0.7s cubic-bezier(0,0,0.2,1) both; }

    /* ── Layer rail ── */
    #rail-wrap { max-width: 1080px; margin: 22px auto 0; padding: 0 48px; }
    #rail { display: flex; gap: 14px; align-items: stretch; }
    .pi-card {
      --c: #8fb8ff;
      flex: 1 1 0; min-width: 0; position: relative; cursor: pointer; text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
      border-top: 2px solid rgba(143,184,255,0.6);
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      padding: 10px 12px; opacity: 0.5;
      transition: opacity 0.35s ease, transform 0.2s ease,
                  box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .pi-card .pi-num {
      font-family: var(--font-display); font-size: 12px; font-weight: 700;
      letter-spacing: 0.08em; color: var(--sf-blue-l); opacity: 0.55;
    }
    /* card title — white, slightly larger (matches slide 3: blue number, white title) */
    .pi-card .pi-name { font-size: 16px; font-weight: 700; color: #fff; margin-top: 4px; line-height: 1.2; }
    .pi-card .pi-tag {
      display: inline-block; margin-top: 6px; font-size: 9px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; padding: 2px 8px;
    }
    /* flow connector between cards */
    .pi-card:not(:last-child)::after {
      content: '\203A'; position: absolute; right: -10px; top: 50%; transform: translateY(-50%);
      font-size: 18px; line-height: 1; font-weight: 400; color: rgba(255,255,255,0.35); z-index: 3;
    }
    .pi-card.active {
      opacity: 1; transform: translateY(-4px);
      border-color: rgba(143,184,255,0.5);
      border-top-color: rgba(143,184,255,0.85);
      background: rgba(143,184,255,0.08);
      box-shadow: 0 10px 24px -12px rgba(143,184,255,0.5);
    }
    .pi-card.done { opacity: 0.78; }

    /* ── Conversational Interface pillar (the foundation) ── */
    #pillar-wrap { max-width: 1080px; margin: 16px auto 0; padding: 0 48px; position: relative; }
    /* little bracket showing it underpins the rail above */
    #pillar-wrap::before {
      content: ''; position: absolute; left: 48px; right: 48px; top: -9px; height: 8px;
      border: 1px solid rgba(255,255,255,0.14); border-bottom: none; border-radius: 6px 6px 0 0;
      opacity: 0.6;
    }
    #pillar {
      --c: #8fb8ff; cursor: pointer; position: relative;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      border-top: 2px solid rgba(143,184,255,0.6);
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      padding: 9px 16px; opacity: 0.5;
      transition: opacity 0.35s ease, transform 0.2s ease,
                  box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    /* just the (centred, white) title — no number or tag */
    #pillar .pi-name { font-size: 16px; font-weight: 700; color: #fff; line-height: 1.2; text-align: center; }
    #pillar.active {
      opacity: 1; transform: translateY(-3px);
      border-color: rgba(143,184,255,0.5);
      border-top-color: rgba(143,184,255,0.85);
      background: rgba(143,184,255,0.08);
      box-shadow: 0 10px 24px -12px rgba(143,184,255,0.5);
    }

    /* ── Big animation card ── styled like the deck's slide-8 cards (clean & simple):
       flat fill, 1px border, 2px electric-blue top accent, no resting shadow. The
       electric-blue accent contrasts with the cloud-blue process cards above. */
    .pi-big {
      --c: #8fb8ff; position: absolute; inset: 24px 48px 84px;
      max-width: 944px; margin: 0 auto; left: 0; right: 0;
      display: flex; flex-direction: column;
      border: 1px solid rgba(255,255,255,0.12);
      border-top: 2px solid rgba(6,106,254,0.42);
      border-radius: 8px; overflow: hidden;
      /* Shared card fill — deep navy, sourced from the Conversational Interface card so
         all six animation cards read as one family (the one hard rule of the brief).
         The .pi-big-stage carries no background of its own, so the navy fills
         edge-to-edge inside the card border. */
      background: #04102f;
      opacity: 0; transform: translateY(46px) scale(0.985); pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.2,0.8,0.2,1),
                  transform 0.6s cubic-bezier(0.2,0.8,0.2,1);
    }
    .pi-big.active { opacity: 1; transform: none; pointer-events: auto; }
    .pi-big.closing { opacity: 0; transform: translateY(34px) scale(0.99); }

    .pi-big-head { flex: 0 0 auto; display: flex; align-items: center; gap: 16px; padding: 18px 24px 14px; }
    .pi-big-num {
      font-family: var(--font-display); font-size: 22px; font-weight: 700;
      color: var(--c); letter-spacing: 0.04em; line-height: 1;
    }
    .pi-big-headtext { flex: 1 1 auto; min-width: 0; }
    .pi-big-name { font-size: 19px; font-weight: 700; color: #fff; line-height: 1.15; }
    .pi-big-desc { font-size: 13px; color: rgba(255,255,255,0.66); line-height: 1.5; margin-top: 4px; max-width: 760px; }
    .pi-big-tag {
      flex: 0 0 auto; align-self: flex-start; font-size: 9.5px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--c);
      border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); border-radius: 999px; padding: 4px 11px;
    }

    /* animation slot fills the whole big card (no header/text) */
    .pi-big-stage {
      flex: 1 1 auto; min-height: 0; position: relative;
      margin: 12px; border-radius: 12px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Placeholder animation slot ── */
    .pi-slot {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; text-align: center;
      border: 1.5px dashed color-mix(in srgb, var(--c) 40%, rgba(255,255,255,0.18));
      border-radius: 12px;
      background:
        radial-gradient(60% 80% at 50% 45%, color-mix(in srgb, var(--c) 12%, transparent), transparent 70%),
        rgba(255,255,255,0.015);
    }
    .pi-slot-ic {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
      animation: slotPulse 2.6s ease-in-out infinite;
    }
    @keyframes slotPulse {
      0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 40%, transparent); }
      50%      { box-shadow: 0 0 0 12px transparent; }
    }
    .pi-slot-label { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.62); }
    .pi-slot-sub { font-size: 12px; color: rgba(255,255,255,0.42); font-style: italic; }

    /* ── Intro overlay (step 0) ── */
    #intro {
      position: absolute; inset: 24px 48px 84px; max-width: 944px; margin: 0 auto; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center; text-align: center;
      opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
    }
    #intro.show { opacity: 1; }
    #intro .pi-intro-card {
      border: 1px dashed rgba(255,255,255,0.22); border-radius: 16px;
      padding: 30px 40px; background: rgba(255,255,255,0.02); max-width: 620px;
    }
    #intro .pi-intro-h { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: #fff; }
    #intro .pi-intro-p { font-size: 13.5px; color: rgba(255,255,255,0.6); margin-top: 12px; line-height: 1.6; }
    #intro .pi-intro-key {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 20px;
      font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85);
    }
    #intro kbd {
      font-family: var(--font-body); font-size: 12px; font-weight: 700; color: #fff;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22);
      border-radius: 6px; padding: 3px 9px;
    }

    /* ── Bottom-left progress / bottom-right nav ── */
    #progress { position: fixed; left: 30px; bottom: 28px; z-index: 6; display: flex; align-items: center; gap: 14px; }
    #dots { display: flex; gap: 8px; }
    #dots .dot {
      width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.25);
      transition: background 0.3s ease, transform 0.3s ease;
    }
    #dots .dot.on { background: #8fb8ff; transform: scale(1.25); }
    #dots .dot.done { background: rgba(255,255,255,0.55); }
    #prog-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.5); }

    #nav { position: fixed; right: 30px; bottom: 24px; z-index: 6; display: flex; align-items: center; gap: 14px; }
    #nav .nav-count { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.55); font-variant-numeric: tabular-nums; }
    #nav button {
      appearance: none; cursor: pointer; width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.28); color: #fff;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease, opacity 0.18s ease;
    }
    #nav button:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.5); }
    #nav button:active { transform: scale(0.94); }
    #nav button:disabled { opacity: 0.3; cursor: default; }

    /* ═══════════ Task Mining animation — the work between the systems ═══════════
       Self-contained: opens on a single source system (echoing Process Mining),
       then generic app windows fade in around it. Faint "between-tool" activity
       (a dashed rim with ghost tokens) surfaces the desktop work the single-system
       view misses; a central intelligence element then ignites and captures it —
       every source spoked inward with bright inflow. All in one SVG so windows,
       rim, spokes and hub share a coordinate space. Scoped under .tm-scene; the
       structural timeline is a CSS cascade fired by toggling .playing. */
    .tm-scene { position: absolute; inset: 0; overflow: hidden; }
    .tm-scene::before { content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(48% 58% at 50% 52%, rgba(20,86,220,0.22), transparent 70%); }
    .tm-svg { position: relative; width: 100%; height: 100%; display: block; }

    /* typed narration — same treatment as the other cards */
    .tm-narrate { position: absolute; top: 20px; left: 28px; right: 28px; z-index: 4;
      font-family: var(--font-display); font-weight: 700; font-size: clamp(15px, 2.1vw, 20px);
      letter-spacing: -0.01em; line-height: 1.25; color: #fff; white-space: nowrap; pointer-events: none; }
    .tm-narrate.wipe { animation: tmWipe 0.6s ease forwards; }
    .tm-hl { color: var(--sf-blue-l); }
    .tm-caret { display: inline-block; width: 2px; height: 1em; background: var(--sf-blue-l);
      margin-left: 2px; vertical-align: -2px; animation: tmBlink 1s step-end infinite; }
    @keyframes tmBlink { 50% { opacity: 0; } }
    @keyframes tmWipe { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 0 0 100%); } }

    /* ── windows: generic apps + the single (emphasised) system ── */
    .tm-win { opacity: 0; transform-box: fill-box; transform-origin: center; transform: translateY(8px) scale(0.94); }
    .tm-win-box   { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.18); stroke-width: 1.2; }
    .tm-sys-box   { fill: rgba(143,184,255,0.07); stroke: rgba(143,184,255,0.38); stroke-width: 1.5; }
    .tm-win-rule  { stroke: rgba(255,255,255,0.12); stroke-width: 1; }
    .tm-win-glyph { fill: none; stroke: #9db8ff; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .tm-win-dot   { fill: rgba(255,255,255,0.28); }
    .tm-win-line  { fill: rgba(255,255,255,0.14); }
    .tm-row       { fill: rgba(143,184,255,0.6); transform-box: fill-box; transform-origin: left center; transform: scaleX(0); }
    .tm-tag       { fill: rgba(143,184,255,0.85); font: 700 9.5px var(--font-body); letter-spacing: 0.16em; opacity: 0; }
    .tm-hubtag    { fill: #dbe8ff; font: 700 11px var(--font-body); letter-spacing: 0.20em; opacity: 0; }

    /* ── between-tool rim (the hidden activity) ── */
    .tm-rim   { fill: none; stroke: #6f86c0; stroke-width: 1.5; stroke-dasharray: 4 5; opacity: 0; }
    .tm-ghost { fill: #aebfe6; }
    .tm-ghosts { opacity: 0; }

    /* ── capture: spokes inward + bright inflow ── */
    .tm-spoke { fill: none; stroke: #7aa0ff; stroke-width: 2.2; stroke-linecap: round;
      stroke-dasharray: 1 1; stroke-dashoffset: 1; opacity: 0;
      filter: drop-shadow(0 0 3px rgba(122,160,255,0.5)); }
    .tm-flow  { fill: #e6f1ff; filter: drop-shadow(0 0 5px rgba(143,184,255,0.95)); }
    .tm-flows { opacity: 0; }

    /* ── central intelligence element ── */
    .tm-hub { opacity: 0; }
    .tm-hub-glow { fill: rgba(143,184,255,0.20); transform-box: fill-box; transform-origin: center; }
    .tm-hub-ring { fill: none; stroke: #8fb8ff; stroke-width: 1.6; }
    .tm-hub-spin { fill: none; stroke: #bcd4ff; stroke-width: 1.6; stroke-dasharray: 6 9; opacity: 0.8;
      transform-box: fill-box; transform-origin: center; }
    .tm-hub-coreglow { fill: none; stroke: #e6f1ff; stroke-width: 1.4; opacity: 0.85; }
    .tm-hub-core { fill: #eaf3ff; }
    .tm-sweep { fill: none; stroke: #bcd4ff; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }

    /* ── timeline (fires on .playing; per-element delays live inline) ── */
    .tm-scene.playing .tm-win   { animation: tmWinIn 0.55s cubic-bezier(.22,1,.36,1) both; }
    .tm-scene.playing .tm-row   { animation: tmRow 0.4s ease both; }
    .tm-scene.playing .tm-tag, .tm-scene.playing .tm-syslabel { animation: tmFade 0.6s 1.4s ease both; }
    .tm-scene.playing .tm-rim   { animation: tmFaint 0.8s 3.2s ease both, tmRimDim 1.0s 8.2s ease forwards; }
    .tm-scene.playing .tm-ghosts { animation: tmGhostIn 0.8s 3.6s ease both, tmGhostDim 1.0s 8.2s ease forwards; }
    .tm-scene.playing .tm-hub    { animation: tmFade 0.7s 5.8s ease both; }
    .tm-scene.playing .tm-hub-glow { animation: tmHubPulse 2.6s 6.4s ease-in-out infinite; }
    .tm-scene.playing .tm-hub-spin { animation: tmSpin 9s 5.8s linear infinite; }
    .tm-scene.playing .tm-sweep  { animation: tmSweep 1.1s 6.0s ease-out forwards; }
    .tm-scene.playing .tm-spoke  { animation: tmDraw 0.7s ease both; }
    .tm-scene.playing .tm-flows  { animation: tmFade 0.8s 7.4s ease both; }
    .tm-scene.playing .tm-hubtag { animation: tmFade 0.7s 8.7s ease both; }

    @keyframes tmWinIn { from { opacity: 0; transform: translateY(8px) scale(0.94); } to { opacity: 1; transform: none; } }
    @keyframes tmRow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes tmFade  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes tmFaint { from { opacity: 0; } to { opacity: 0.34; } }
    @keyframes tmRimDim { to { opacity: 0.12; } }
    @keyframes tmGhostIn { from { opacity: 0; } to { opacity: 0.72; } }
    @keyframes tmGhostDim { to { opacity: 0.18; } }
    @keyframes tmDraw  { 0% { opacity: 1; stroke-dashoffset: 1; } 100% { opacity: 0.9; stroke-dashoffset: 0; } }
    @keyframes tmHubPulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.18); opacity: 0.5; } }
    @keyframes tmSpin { to { transform: rotate(360deg); } }
    @keyframes tmSweep { 0% { opacity: 0; transform: scale(0.2); } 14% { opacity: 0.7; } 100% { opacity: 0; transform: scale(4.2); } }

    @media (prefers-reduced-motion: reduce) {
      .tm-scene .tm-win, .tm-scene .tm-tag, .tm-scene .tm-syslabel, .tm-scene .tm-hubtag,
      .tm-scene .tm-hub, .tm-scene .tm-flows { opacity: 1 !important; transform: none !important; animation: none !important; }
      .tm-scene .tm-row   { transform: scaleX(1) !important; animation: none !important; }
      .tm-scene .tm-rim   { opacity: 0.3 !important; animation: none !important; }
      .tm-scene .tm-ghosts { opacity: 0.5 !important; animation: none !important; }
      .tm-scene .tm-spoke { opacity: 0.9 !important; stroke-dashoffset: 0 !important; animation: none !important; }
      .tm-scene .tm-hub-glow, .tm-scene .tm-hub-spin { animation: none !important; }
      .tm-scene .tm-sweep { opacity: 0 !important; animation: none !important; }
      .tm-scene .tm-narrate.wipe { animation: none !important; }
    }

    /* ═══════════ Conversational Interface animation — the few → the many ═══════════
       Narrated: "It used to take an expert" → two experts → they shrink into an organic
       whole-org crowd as "Now anyone can ask." types; then "In their own words." + questions. */
    .cv-scene { position: absolute; inset: 0; display: flex; }
    /* same soft radial atmosphere the other cards carry over the navy fill */
    .cv-scene::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(52% 60% at 50% 52%, rgba(20,86,220,0.18), transparent 70%); }
    .cv-people { position: relative; flex: 1.7 1 0; overflow: hidden; }
    /* soft cloud-blue glow behind the crowd (atmosphere / depth) */
    .cv-people::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(46% 52% at 50% 62%, rgba(0,179,255,0.14), transparent 72%);
      opacity: 0; transition: opacity 1.4s ease; }
    .cv-scene.revealed .cv-people::before { opacity: 1; }
    .cv-questions { position: relative; flex: 1.2 1 0; min-width: 0; display: flex; flex-direction: column;
      justify-content: flex-start; padding: 26px 16px 16px; }
    /* softened divider — a gradient hairline that fades at top & bottom */
    .cv-questions::before { content: ''; position: absolute; left: 0; top: 9%; bottom: 9%; width: 1px; pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.16) 22%, rgba(255,255,255,0.16) 78%, transparent); }
    .cv-qlist { display: flex; flex-direction: column; justify-content: flex-start; gap: 9px; }

    /* typed narration lines — left (cv-narrate) and right (cv-rtitle), same font + size */
    .cv-narrate, .cv-rtitle { font-family: var(--font-display); font-weight: 700;
      font-size: clamp(15px, 2.2vw, 20px); letter-spacing: -0.01em; line-height: 1.25; color: #fff; }
    .cv-narrate { position: absolute; top: 26px; left: 6%; right: 6%; white-space: nowrap; }   /* top matches the right title (cv-questions padding-top) */
    .cv-narrate.wipe { clip-path: inset(0 0 0 0); animation: cvWipe 0.77s ease forwards; }
    .cv-rtitle { color: var(--sf-blue-l); margin: 0 0 14px; }   /* in flow → questions start right beneath it */
    .cv-hl { color: var(--sf-blue-l); }
    .cv-caret { display: inline-block; width: 2px; height: 1em; background: var(--sf-blue-l);
      margin-left: 2px; vertical-align: -2px; animation: cvBlink 1s step-end infinite; }

    /* expert "spotlight" — a soft pool of light under the two experts during act 1 */
    .cv-spotlight { position: absolute; left: 50%; top: 86%; width: 52%; height: 15%; transform: translate(-50%,-50%);
      background: radial-gradient(50% 50% at 50% 50%, rgba(0,179,255,0.32), transparent 70%);
      filter: blur(7px); opacity: 0; transition: opacity 0.9s ease; pointer-events: none; z-index: 0; }
    .cv-scene.experts .cv-spotlight { opacity: 1; }
    .cv-scene.revealed .cv-spotlight { opacity: 0; transition: opacity 0.8s ease; }

    /* crowd cloud (organic, absolute positions + per-person depth set inline) */
    .cv-crowd { position: absolute; inset: 22% 3% 6% 3%; }
    /* constellation — faint links between near neighbours, behind the people */
    .cv-net { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 0; transition: opacity 1.6s ease; }
    .cv-scene.revealed .cv-net { opacity: 1; }
    .cv-net line { stroke: rgba(143,184,255,0.13); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .cv-dot, .cv-hero-ic { position: absolute; width: 9.6%; aspect-ratio: 1; transform: translate(-50%,-50%); }
    .cv-dot svg, .cv-hero-ic svg { width: 100%; height: 100%; display: block; fill: currentColor; }
    .cv-dot { color: #cdd6e1; opacity: 0; z-index: 1; transition: color 0.5s ease, filter 0.5s ease; }   /* the wider org — slightly grey; size/brightness/depth set inline */
    .cv-dot.asking { color: #ffffff !important; filter: drop-shadow(0 0 9px rgba(255,255,255,0.95)); z-index: 11; }   /* lights up white as it "asks" (kept distinct from the blue experts) */
    .cv-dot svg { animation: cvFloat 3s ease-in-out infinite; animation-delay: calc(var(--d,0) * 1s); }
    .cv-scene.revealed .cv-dot { animation: cvFade 1.1s calc(var(--i,0) * 0.05s) ease forwards; }   /* slow fade-in */

    /* the two experts — appear large & centred (.experts), then slowly fly in & shrink (.revealed) */
    .cv-hero-ic { --amp: 10px; color: var(--sf-blue-l); opacity: 0; z-index: 12;
      filter: drop-shadow(0 0 12px rgba(0,179,255,0.6));
      transform: translate(-50%,-50%) translate(var(--sx,0), var(--sy,0)) scale(var(--hs,4.2));
      transition: transform 2.5s cubic-bezier(0.4,0,0.2,1), opacity 0.9s ease; }
    .cv-scene.experts .cv-hero-ic { opacity: 1; }
    .cv-scene.revealed .cv-hero-ic { transform: translate(-50%,-50%) scale(1); }
    .cv-scene.revealed .cv-hero-ic svg { animation: cvFloat 3s ease-in-out infinite; }

    /* crowd → question pulses (a token travels from a person to each new question) */
    .cv-link-layer { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
    .cv-pulse-svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity 0.45s ease; }
    .cv-pulse-line  { fill: none; stroke: rgba(143,184,255,0.45); stroke-width: 1.3; stroke-dasharray: 3 4; vector-effect: non-scaling-stroke; }
    .cv-pulse-token { position: absolute; left: 0; top: 0; width: 10px; height: 10px; margin: -5px 0 0 -5px;
      border-radius: 50%; background: #eaf6ff; box-shadow: 0 0 9px 2px rgba(0,179,255,0.95); }
    .cv-pulse-halo  { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px;
      border-radius: 50%; background: radial-gradient(circle, rgba(0,179,255,0.38), transparent 70%); }

    /* question bubbles (one size larger) — each with a small "asker" avatar */
    .cv-q { position: relative; align-self: flex-start; max-width: 100%;
      display: flex; align-items: flex-start; gap: 9px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px 12px 12px 4px; padding: 10px 13px; font-size: 13.5px; line-height: 1.4;
      color: #fff; animation: cvQIn 0.4s cubic-bezier(0.22,1,0.36,1) both; }
    .cv-q-av { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 1px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; color: #cdd6e1; background: rgba(255,255,255,0.10); }
    .cv-q-av svg { width: 13px; height: 13px; display: block; fill: currentColor; }
    .cv-q-av.expert { color: var(--sf-blue-l); background: rgba(0,179,255,0.18); }
    .cv-q-body { flex: 1 1 auto; min-width: 0; }
    .cv-q .cv-tick { display: inline-block; margin-left: 6px; color: #04E1CB; font-weight: 700; opacity: 0; transition: opacity 0.3s ease; }
    .cv-q.answered .cv-tick { opacity: 1; }

    @keyframes cvFloat {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(calc(var(--amp,8px) * 0.16), calc(var(--amp,8px) * -0.55)); }
      50% { transform: translate(0, calc(var(--amp,8px) * -1)); }
      75% { transform: translate(calc(var(--amp,8px) * -0.16), calc(var(--amp,8px) * -0.45)); }
    }
    @keyframes cvFade  { from { opacity: 0; transform: translate(-50%,-50%) scale(0.7); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
    @keyframes cvWipe  { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 0 0 100%); } }
    @keyframes cvQIn   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes cvBlink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .cv-scene .cv-dot { opacity: 1 !important; transform: translate(-50%,-50%) !important; animation: none !important; }
      .cv-scene .cv-dot svg { animation: none !important; }
      .cv-scene .cv-hero-ic { opacity: 1 !important; transform: translate(-50%,-50%) scale(1) !important; transition: none !important; }
      .cv-narrate.wipe { animation: none !important; }
    }

    /* ═══════════ Process Mining animation — data → the real process map ═══════════
       Self-contained: a single source system streams its event log; the records
       assemble into a clean process flow, which then reveals its real variation —
       an alternative path, a rework loop and a bottleneck. Everything originates
       from the one system, keeping the scene scoped to a single source. All drawn
       in one SVG so panel, graph and labels share a coordinate space. Scoped under
       .pm-scene; the whole timeline is a CSS cascade fired by toggling .playing. */
    .pm-scene { position: absolute; inset: 0; overflow: hidden; }
    /* atmospheric depth behind the graph (mirrors the conversational card's glow) */
    .pm-scene::before { content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(54% 62% at 57% 52%, rgba(20,86,220,0.20), transparent 70%); }
    .pm-svg { position: relative; width: 100%; height: 100%; display: block; }

    /* typed narration — same treatment as the conversational card's narration line */
    .pm-narrate { position: absolute; top: 20px; left: 28px; right: 28px; z-index: 4;
      font-family: var(--font-display); font-weight: 700; font-size: clamp(15px, 2.1vw, 20px);
      letter-spacing: -0.01em; line-height: 1.25; color: #fff; white-space: nowrap; pointer-events: none; }
    .pm-narrate.wipe { animation: pmWipe 0.6s ease forwards; }
    .pm-hl { color: var(--sf-blue-l); }
    .pm-caret { display: inline-block; width: 2px; height: 1em; background: var(--sf-blue-l);
      margin-left: 2px; vertical-align: -2px; animation: pmBlink 1s step-end infinite; }
    @keyframes pmBlink { 50% { opacity: 0; } }
    @keyframes pmWipe { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 0 0 100%); } }

    /* ── source system panel (the single origin of all the data) ── */
    .pm-sys-box   { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.20); stroke-width: 1.3;
      opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(0.96); }
    .pm-sys-glyph { fill: none; stroke: #8fb8ff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .pm-sys-label { fill: rgba(255,255,255,0.88); font: 700 14px var(--font-body); }
    .pm-sys-rule  { stroke: rgba(255,255,255,0.14); stroke-width: 1; }
    .pm-sys-scope { fill: rgba(143,184,255,0.85); font: 700 9.5px var(--font-body); letter-spacing: 0.16em; opacity: 0; }
    .pm-row       { fill: rgba(143,184,255,0.55); transform-box: fill-box; transform-origin: left center; transform: scaleX(0); }

    /* ── graph: edges, nodes, cores ── */
    .pm-edge { fill: none; stroke: #6f9bff; stroke-width: 2.6; stroke-linecap: round;
      stroke-dasharray: 1 1; stroke-dashoffset: 1; opacity: 0;
      filter: drop-shadow(0 0 3px rgba(111,155,255,0.45)); }
    .pm-edge--alt    { stroke: #7aa0ff; stroke-width: 2.2; }
    .pm-edge--rework { stroke: #ffb24d; stroke-width: 2.2; }
    .pm-node { fill: #0a1c44; stroke: #8fb8ff; stroke-width: 2.4; opacity: 0;
      transform-box: fill-box; transform-origin: center; transform: scale(0.2);
      filter: drop-shadow(0 0 6px rgba(143,184,255,0.35)); }
    .pm-core { fill: #bcd4ff; opacity: 0; }
    .pm-tok  { fill: #e6f1ff; filter: drop-shadow(0 0 5px rgba(143,184,255,0.95)); }
    .pm-tokens { opacity: 0; }
    .pm-label { fill: rgba(255,255,255,0.72); font: 700 13px var(--font-body); letter-spacing: 0.03em; opacity: 0; }
    .pm-label--rework { fill: #ffce93; }
    .pm-label--bottle { fill: #ffce93; }

    /* bottleneck flare on the worst node */
    .pm-bottle-glow { fill: rgba(255,160,60,0.18); opacity: 0; }
    .pm-bottle-ring { fill: none; stroke: #ffb24d; stroke-width: 2.2; opacity: 0;
      transform-box: fill-box; transform-origin: center; }

    /* ── timeline (fires when .playing is added; per-element delays live inline) ── */
    .pm-scene.playing .pm-sys-box   { animation: pmSysIn 0.6s 0.2s cubic-bezier(.22,1,.36,1) both; }
    .pm-scene.playing .pm-sys-scope { animation: pmFade 0.6s 1.2s ease both; }
    .pm-scene.playing .pm-row       { animation: pmRow 0.45s ease both; }
    .pm-scene.playing .pm-edge      { animation: pmDraw 0.7s ease both; }
    .pm-scene.playing .pm-node      { animation: pmNode 0.5s cubic-bezier(.22,1,.36,1) both; }
    .pm-scene.playing .pm-core      { animation: pmFade 0.5s ease both; }
    .pm-scene.playing .pm-tokens    { animation: pmFade 0.8s 1.3s ease both; }
    .pm-scene.playing .pm-label     { animation: pmFade 0.6s ease both; }
    .pm-scene.playing .pm-bottle-glow { animation: pmFade 0.8s 5.5s ease forwards; }
    .pm-scene.playing .pm-bottle-ring { animation: pmRingIn 0.6s 5.5s ease forwards, pmRingPulse 2.2s 6.1s ease-in-out infinite; }
    /* the bottleneck node keeps its pop, then warms to amber (own rule → independent delays) */
    .pm-scene.playing .pm-node--bottle { animation: pmNode 0.5s 2.1s cubic-bezier(.22,1,.36,1) both, pmWarm 0.9s 5.5s ease forwards; }

    @keyframes pmSysIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes pmRow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pmDraw  { 0% { opacity: 1; stroke-dashoffset: 1; } 100% { opacity: 0.92; stroke-dashoffset: 0; } }
    @keyframes pmNode  { 0% { opacity: 0; transform: scale(0.2); } 60% { opacity: 1; transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes pmFade  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pmWarm  { to { stroke: #ffb24d; } }
    @keyframes pmRingIn { from { opacity: 0; } to { opacity: 0.8; } }
    @keyframes pmRingPulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.32); opacity: 0.18; } }

    @media (prefers-reduced-motion: reduce) {
      .pm-scene .pm-sys-box, .pm-scene .pm-sys-scope, .pm-scene .pm-core,
      .pm-scene .pm-tokens, .pm-scene .pm-label, .pm-scene .pm-bottle-glow { opacity: 1 !important; animation: none !important; }
      .pm-scene .pm-row  { transform: scaleX(1) !important; animation: none !important; }
      .pm-scene .pm-edge { opacity: 0.92 !important; stroke-dashoffset: 0 !important; animation: none !important; }
      .pm-scene .pm-node { opacity: 1 !important; transform: none !important; animation: none !important; }
      .pm-scene .pm-node--bottle { stroke: #ffb24d !important; }
      .pm-scene .pm-bottle-ring { opacity: 0.7 !important; animation: none !important; }
      .pm-scene .pm-narrate.wipe { animation: none !important; }
    }

    /* ═══════════ Shared scaffolding for cards 3–6 ═══════════
       A common scene shell (navy glow + full-bleed SVG) and one typed-narration
       treatment, so every remaining card matches cards 1–2 and the conversational
       card without re-declaring the basics. Each card layers its own classes on top. */
    .pi-cardscene { position: absolute; inset: 0; overflow: hidden; }
    .pi-cardscene::before { content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(52% 60% at 50% 52%, rgba(20,86,220,0.18), transparent 70%); }
    .pi-cardsvg { position: relative; width: 100%; height: 100%; display: block; }
    .pi-narr { position: absolute; top: 20px; left: 28px; right: 28px; z-index: 4;
      font-family: var(--font-display); font-weight: 700; font-size: clamp(15px, 2.1vw, 20px);
      letter-spacing: -0.01em; line-height: 1.25; color: #fff; white-space: nowrap; pointer-events: none; }
    .pi-narr.wipe { animation: piNarrWipe 0.6s ease forwards; }
    .pi-hl { color: var(--sf-blue-l); }
    .pi-caret { display: inline-block; width: 2px; height: 1em; background: var(--sf-blue-l);
      margin-left: 2px; vertical-align: -2px; animation: piNarrBlink 1s step-end infinite; }
    @keyframes piNarrBlink { 50% { opacity: 0; } }
    @keyframes piNarrWipe { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 0 0 100%); } }
    @keyframes piFade { from { opacity: 0; } to { opacity: 1; } }

    /* ═══════════ Analysis — measure into Cost / Resource / Time, flare the worst ═══════════ */
    .an-node { fill: #0a1c44; stroke: #8fb8ff; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(0.3); }
    .an-edge { stroke: #5f7fce; stroke-width: 2; opacity: 0; }
    .an-scan { opacity: 0; }
    .an-scan-line { stroke: #bcd4ff; stroke-width: 2.5; filter: drop-shadow(0 0 6px rgba(143,184,255,0.9)); }
    .an-tile { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.12); stroke-width: 1; opacity: 0; }
    .an-label { fill: rgba(255,255,255,0.62); font: 700 12px var(--font-body); letter-spacing: 0.14em; }
    .an-num   { fill: #eaf3ff; font: 700 30px var(--font-display); }
    .an-sub   { fill: rgba(255,255,255,0.5); font: 600 11px var(--font-body); letter-spacing: 0.04em; }
    .an-gauge-track { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 8; }
    .an-gauge-val { fill: none; stroke: #6f9bff; stroke-width: 8; stroke-linecap: round;
      stroke-dasharray: 100; stroke-dashoffset: 100; transform-box: fill-box; transform-origin: center; transform: rotate(-90deg);
      transition: stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1), stroke 0.6s ease; }
    .an-scene.playing .an-gauge-val { stroke-dashoffset: calc(100 - var(--val, 0)); }
    .an-glow { fill: rgba(255,140,70,0); }
    .an-worsttag { fill: #ffce93; font: 700 10px var(--font-body); letter-spacing: 0.12em; opacity: 0; }
    .an-scene.playing .an-node { animation: anPop 0.45s cubic-bezier(.22,1,.36,1) both; }
    .an-scene.playing .an-edge { animation: piFade 0.5s both; }
    .an-scene.playing .an-tile { animation: piFade 0.6s both; }
    .an-scene.playing .an-scan { animation: anScan 2.4s 1.4s cubic-bezier(.4,0,.2,1) forwards; }
    .an-scene.playing .an-glow       { animation: anGlowIn 0.8s 7.0s ease forwards, anGlowPulse 2.4s 7.8s ease-in-out infinite; }
    .an-scene.playing .an-num--worst { animation: anWarmNum 0.8s 7.0s ease forwards; }
    .an-scene.playing .an-gauge-val--worst { animation: anWarmArc 0.8s 7.0s ease forwards; }
    .an-scene.playing .an-worsttag   { animation: piFade 0.6s 7.2s ease both; }
    @keyframes anPop { 0% { opacity: 0; transform: scale(0.3); } 60% { opacity: 1; transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes anScan { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(600px); opacity: 0; } }
    @keyframes anGlowIn { to { fill: rgba(255,140,70,0.16); } }
    @keyframes anGlowPulse { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }
    @keyframes anWarmNum { to { fill: #ff9a6a; } }
    @keyframes anWarmArc { to { stroke: #ff7a5c; } }

    /* ═══════════ Recommendation — set a priority, AI proposes, you decide ═══════════ */
    .rc-chip { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.14); stroke-width: 1; opacity: 0; }
    .rc-chip--prio { fill: rgba(6,106,254,0.10); stroke: rgba(111,155,255,0.6); stroke-width: 1.4; }
    .rc-chiplabel { fill: rgba(255,255,255,0.78); font: 700 12px var(--font-body); letter-spacing: 0.06em; }
    .rc-bar-track { fill: rgba(255,255,255,0.10); }
    .rc-bar-fill  { fill: #6f9bff; transform-box: fill-box; transform-origin: left center; transform: scaleX(0); }
    .rc-bar-fill--prio { fill: #8fb8ff; }
    .rc-priotag { fill: #bcd4ff; font: 700 8.5px var(--font-body); letter-spacing: 0.14em; opacity: 0; }
    .rc-orb { opacity: 0; }
    .rc-orb-glow { fill: rgba(111,155,255,0.22); transform-box: fill-box; transform-origin: center; }
    .rc-orb-ring { fill: none; stroke: #8fb8ff; stroke-width: 1.5; }
    .rc-orb-spin { fill: none; stroke: #bcd4ff; stroke-width: 1.4; stroke-dasharray: 5 8; opacity: 0.85; transform-box: fill-box; transform-origin: center; }
    .rc-orb-core { fill: #eaf3ff; }
    .rc-orb-label { fill: #04102f; font: 800 13px var(--font-display); letter-spacing: 0.04em; }
    .rc-beam { stroke: #8fb8ff; stroke-width: 2; stroke-dasharray: 1 1; stroke-dashoffset: 1; opacity: 0; filter: drop-shadow(0 0 3px rgba(143,184,255,0.6)); }
    .rc-tok  { fill: #eaf3ff; opacity: 0; filter: drop-shadow(0 0 5px rgba(143,184,255,0.95)); }
    .rc-card { fill: rgba(10,28,68,0.72); stroke: rgba(111,155,255,0.4); stroke-width: 1.4; opacity: 0; transform-box: fill-box; transform-origin: center; transform: translateY(10px) scale(0.97); }
    .rc-card-tag { fill: #bcd4ff; font: 700 9.5px var(--font-body); letter-spacing: 0.12em; opacity: 0; }
    .rc-card-title { fill: #ffffff; font: 700 17px var(--font-display); opacity: 0; }
    .rc-eff-label { fill: rgba(255,255,255,0.66); font: 600 12px var(--font-body); opacity: 0; }
    .rc-eff-val   { fill: #5fe3a0; font: 700 13px var(--font-body); opacity: 0; }
    .rc-eff-val--prio { fill: #7CFFC4; }
    .rc-eff-bar-t { fill: rgba(255,255,255,0.10); opacity: 0; }
    .rc-eff-bar-f { fill: #36c98a; transform-box: fill-box; transform-origin: left center; transform: scaleX(0); }
    .rc-btn { opacity: 0; }
    .rc-btn-box { fill: none; stroke: rgba(255,255,255,0.4); stroke-width: 1.3; }
    .rc-accept-box { fill: #1356d6; stroke: #6f9bff; stroke-width: 1.3; }
    .rc-btn-label { fill: #fff; font: 700 12px var(--font-body); letter-spacing: 0.04em; }
    .rc-cursor { opacity: 0; }
    .rc-cursor path { fill: #ffffff; stroke: #04102f; stroke-width: 1; }
    .rc-scene.playing .rc-chip { animation: piFade 0.5s both; }
    .rc-scene.playing .rc-bar-fill { animation: rcBar 0.9s cubic-bezier(.4,0,.2,1) both; }
    .rc-scene.playing .rc-priotag { animation: piFade 0.5s 2.4s ease both; }
    .rc-scene.playing .rc-orb { animation: piFade 0.6s 0.4s ease both; }
    .rc-scene.playing .rc-orb-glow { animation: rcOrbPulse 2.4s ease-in-out infinite; }
    .rc-scene.playing .rc-orb-spin { animation: rcSpin 7s linear infinite; }
    .rc-scene.playing .rc-beam { animation: rcDraw 0.6s 3.5s ease forwards; }
    .rc-scene.playing .rc-tok  { animation: rcTok 0.7s 3.6s ease forwards; }
    .rc-scene.playing .rc-card { animation: rcCardIn 0.6s 4.0s cubic-bezier(.22,1,.36,1) both; }
    .rc-scene.playing .rc-card-tag   { animation: piFade 0.5s 4.4s ease both; }
    .rc-scene.playing .rc-card-title { animation: rcRise 0.5s 4.6s ease both; }
    .rc-scene.playing .rc-eff-label  { animation: piFade 0.5s ease both; }
    .rc-scene.playing .rc-eff-val    { animation: piFade 0.5s ease both; }
    .rc-scene.playing .rc-eff-bar-t  { animation: piFade 0.4s ease both; }
    .rc-scene.playing .rc-eff-bar-f  { animation: rcBar 0.8s cubic-bezier(.4,0,.2,1) both; }
    .rc-scene.playing .rc-btn { animation: piFade 0.5s 5.8s ease both; }
    .rc-scene.playing .rc-accept-box { animation: rcAccept 1.8s 6.6s ease-in-out infinite; }
    .rc-scene.playing .rc-cursor { animation: rcCursorIn 0.5s 6.2s ease forwards, rcCursorNudge 1.6s 7.0s ease-in-out infinite; }
    @keyframes rcBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes rcOrbPulse { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.16); opacity: 0.5; } }
    @keyframes rcSpin { to { transform: rotate(360deg); } }
    @keyframes rcDraw { from { opacity: 1; stroke-dashoffset: 1; } to { opacity: 0.9; stroke-dashoffset: 0; } }
    @keyframes rcTok { 0% { opacity: 0; offset-distance: 0%; } 15% { opacity: 1; } 100% { opacity: 0; offset-distance: 100%; } }
    @keyframes rcCardIn { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: none; } }
    @keyframes rcRise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes rcAccept { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }
    @keyframes rcCursorIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rcCursorNudge { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -3px); } }

    /* ═══════════ Simulation — Before → After, marked as a projection ═══════════ */
    .si-watermark { fill: rgba(143,184,255,0.10); font: 800 60px var(--font-display); letter-spacing: 0.06em; }
    .si-projtag { fill: #bcd4ff; font: 700 10px var(--font-body); letter-spacing: 0.16em; opacity: 0; }
    .si-state { fill: rgba(255,255,255,0.85); font: 700 13px var(--font-display); letter-spacing: 0.06em; }
    .si-node { fill: #0a1c44; stroke: #8fb8ff; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(0.3); }
    .si-node--bottle { stroke: #ffb24d; }
    .si-edge { fill: none; stroke: #6f9bff; stroke-width: 2.4; stroke-linecap: round; opacity: 0; }
    .si-edge--rework { stroke: #ffb24d; }
    .si-tile { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.12); stroke-width: 1; opacity: 0; }
    .si-tlabel { fill: rgba(255,255,255,0.6); font: 700 11px var(--font-body); letter-spacing: 0.12em; }
    .si-num { fill: #ff8a6a; font: 700 25px var(--font-display); transition: fill 0.8s ease; }
    .si-delta { fill: #5fe3a0; font: 700 12px var(--font-body); opacity: 0; }
    .si-scene.playing .si-node { animation: anPop 0.45s cubic-bezier(.22,1,.36,1) both; }
    .si-scene.playing .si-edge { animation: piFade 0.5s both; }
    .si-scene.playing .si-tile { animation: piFade 0.6s both; }
    .si-scene.playing .si-projtag { animation: piFade 0.6s 0.4s ease both; }
    /* the "run": rework + bottleneck resolve, figures go green */
    .si-scene.playing .si-edge--rework { animation: piFade 0.5s both, siFadeOut 0.8s 3.6s ease forwards; }
    .si-scene.playing .si-node--bottle { animation: anPop 0.45s cubic-bezier(.22,1,.36,1) both, siCalm 0.9s 3.6s ease forwards; }
    .si-scene.playing .si-num--live { animation: siGreen 0.8s 4.6s ease forwards; }
    .si-scene.playing .si-delta { animation: piFade 0.6s 4.8s ease both; }
    .si-scene.playing .si-after { animation: piFade 0.6s 3.5s ease both; }
    .si-scene.playing .si-before-fade { animation: siFadeOut 0.6s 3.6s ease forwards; }
    @keyframes siFadeOut { to { opacity: 0; } }
    @keyframes siCalm { to { stroke: #8fb8ff; } }
    @keyframes siGreen { to { fill: #5fe3a0; } }

    /* ═══════════ Monitor — holding, watched, drift caught (calm) ═══════════ */
    .mo-node { fill: #0a1c44; stroke: #7fc8b0; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(0.3); }
    .mo-node--drift { transition: stroke 0.5s ease; }
    .mo-edge { fill: none; stroke: #4f9c86; stroke-width: 2.2; stroke-linecap: round; opacity: 0; }
    .mo-pulse { fill: #aef0d8; opacity: 0; filter: drop-shadow(0 0 5px rgba(120,230,190,0.9)); }
    .mo-spark { fill: none; stroke: #6fe0b4; stroke-width: 1.8; stroke-linejoin: round; opacity: 0; }
    .mo-spark-dot { fill: #d6fff0; opacity: 0; filter: drop-shadow(0 0 4px rgba(120,230,190,0.95)); }
    .mo-live { opacity: 0; }
    .mo-live-dot { fill: #5fe3a0; transform-box: fill-box; transform-origin: center; }
    .mo-live-label { fill: rgba(255,255,255,0.7); font: 700 11px var(--font-body); letter-spacing: 0.16em; }
    .mo-status { fill: rgba(255,255,255,0.62); font: 600 12px var(--font-body); letter-spacing: 0.04em; opacity: 0; }
    .mo-flag { opacity: 0; transform-box: fill-box; transform-origin: center bottom; }
    .mo-flag-ring { fill: none; stroke: #ffc24d; stroke-width: 2; transform-box: fill-box; transform-origin: center; }
    .mo-flag-pole { stroke: #ffce85; stroke-width: 1.6; }
    .mo-flag-flag { fill: #ffc24d; }
    .mo-flag-label { fill: #ffd98a; font: 700 10px var(--font-body); letter-spacing: 0.08em; }
    .mo-scene.playing .mo-node { animation: anPop 0.5s cubic-bezier(.22,1,.36,1) both; }
    .mo-scene.playing .mo-edge { animation: piFade 0.6s both; }
    .mo-scene.playing .mo-pulse { animation: piFade 0.8s 1.6s ease both; }
    .mo-scene.playing .mo-spark { animation: piFade 0.8s 1.4s ease both; }
    .mo-scene.playing .mo-spark-dot { animation: piFade 0.8s 1.6s ease both; }
    .mo-scene.playing .mo-live { animation: piFade 0.7s 1.0s ease both; }
    .mo-scene.playing .mo-live-dot { animation: moBlink 2.4s 1.2s ease-in-out infinite; }
    .mo-scene.playing .mo-status { animation: piFade 0.6s 2.2s ease both; }
    /* drift caught at ~5s — one node warms, a flag pops calmly */
    .mo-scene.playing .mo-node--drift { animation: anPop 0.5s cubic-bezier(.22,1,.36,1) both, moDrift 0.6s 5.0s ease forwards; }
    .mo-scene.playing .mo-flag { animation: moFlagIn 0.6s 5.1s cubic-bezier(.22,1,.36,1) forwards; }
    .mo-scene.playing .mo-flag-ring { animation: moRing 2.2s 5.4s ease-in-out infinite; }
    @keyframes moBlink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.82); } }
    @keyframes moDrift { to { stroke: #ffc24d; } }
    @keyframes moFlagIn { from { opacity: 0; transform: translateY(6px) scale(0.9); } to { opacity: 1; transform: none; } }
    @keyframes moRing { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.25); opacity: 0.25; } }

    /* reduced motion — settle every card on its final, readable frame */
    @media (prefers-reduced-motion: reduce) {
      .pi-narr.wipe { animation: none !important; }
      .an-node, .an-tile, .an-edge, .an-worsttag { opacity: 1 !important; transform: none !important; animation: none !important; }
      .an-gauge-val { transition: none !important; stroke-dashoffset: calc(100 - var(--val,0)) !important; }
      .an-glow { fill: rgba(255,140,70,0.16) !important; animation: none !important; }
      .an-scan { opacity: 0 !important; animation: none !important; }
      .rc-chip, .rc-priotag, .rc-orb, .rc-card, .rc-card-tag, .rc-card-title, .rc-eff-label, .rc-eff-val, .rc-eff-bar-t, .rc-btn, .rc-cursor { opacity: 1 !important; transform: none !important; animation: none !important; }
      .rc-bar-fill, .rc-eff-bar-f { transform: scaleX(1) !important; animation: none !important; }
      .rc-beam { opacity: 0 !important; } .rc-tok { opacity: 0 !important; }
      .si-node, .si-edge, .si-tile, .si-projtag, .si-delta, .si-after { opacity: 1 !important; transform: none !important; animation: none !important; }
      .si-edge--rework, .si-before-fade { opacity: 0 !important; }
      .si-node--bottle { stroke: #8fb8ff !important; } .si-num--live { fill: #5fe3a0 !important; }
      .mo-node, .mo-edge, .mo-pulse, .mo-spark, .mo-spark-dot, .mo-live, .mo-status, .mo-flag { opacity: 1 !important; transform: none !important; animation: none !important; }
      .mo-node--drift { stroke: #ffc24d !important; }
    }

    /* ── Responsive ── */
    @media (max-width: 1000px) {
      #rail { flex-wrap: wrap; }
      .pi-card { flex: 1 1 28%; }
      .pi-card:not(:last-child)::after { display: none; }

    @media (max-width: 720px) {
      #bottom, .pi-big, #intro { padding-left: 18px; padding-right: 18px; }
      .pi-big { inset: 24px 18px 84px; }
      #intro { inset: 24px 18px 84px; }
      #caption, #rail-wrap, #pillar-wrap { padding-left: 18px; padding-right: 18px; }
    }
  </style>

<script>
(() => {
  'use strict';

  // ── Layer data ─────────────────────────────────────────────────
  // Each layer becomes a rail card + a big card. `anim` selects its animation
  // ('mining', 'tasks', 'convo'); anything else gets a swappable placeholder.
  const LAYERS = [
    { num:'01', name:'Process Mining',  tag:'System',  color:'#8fb8ff', anim:'mining',
      sub:'See how the process really runs &mdash; not how the diagram on the wall says it should.',
      desc:'Reconstructs how a process actually runs inside a system from event logs &mdash; every variant, bottleneck and rework loop.' },
    { num:'02', name:'Task Mining',     tag:'Desktop', color:'#8fb8ff', anim:'tasks',
      sub:'See the work <em>between</em> the systems &mdash; where process mining goes blind.',
      desc:'Captures the work between systems at the desktop &mdash; the look-ups, emails and manual hand-offs that process mining alone cannot see.' },
    { num:'03', name:'Analysis',        tag:'Insight', color:'#8fb8ff', anim:'analysis',
      sub:'Put a number on the waste &mdash; and on the prize.',
      desc:'Quantifies the cost of inefficiency and the value of recoverable waste, turning observation into a business case.' },
    { num:'04', name:'Recommendation',  tag:'AI',      color:'#8fb8ff', anim:'recommend',
      sub:'From problem to the specific fix &mdash; proposed by AI.',
      desc:'AI proposes the specific change to make &mdash; not just the problem, but the mechanism that fixes it.' },
    { num:'05', name:'Simulation',      tag:'Proof',   color:'#8fb8ff', anim:'simulate',
      sub:'Prove the change works <em>before</em> you make it.',
      desc:'Validates the recommendation before you commit, modelling the impact across cost, time and risk.' },
    { num:'06', name:'Monitor',         tag:'Live',    color:'#8fb8ff', anim:'monitor',
      sub:'Keep it fixed &mdash; watch the process live and catch drift the moment it appears.',
      desc:'Watches the process in production, confirming the change held and catching drift the moment it appears.' },
  ];
  const FOUNDATION = { num:'07', name:'Conversational Interface', tag:'Underpins all', color:'#8fb8ff', anim:'convo',
    sub:'Ask anything in plain English &mdash; the layer that underpins them all.',
    desc:'The layer that underpins every other: ask any question in plain English and get an evidence-backed answer drawn from all six layers above.' };

  const STEPS = LAYERS.length + 1;            // 6 layers + conversational interface
  const ALL = LAYERS.concat([FOUNDATION]);    // index aligned with focus steps 1..7

  // ── Task Mining animation (the work between the systems) ────────
  // One SVG (viewBox 1000×560). A single source system opens centre-top (echoing
  // Process Mining), generic app windows fade in around it, faint between-tool
  // activity (a dashed rim with ghost tokens) surfaces, then a central intelligence
  // element ignites and captures it — every source spoked inward with bright inflow.
  // Geometry is generated here; the CSS cascade (.playing) runs the timeline and
  // playTM() types the narration. All sources sit on a ring around the hub.
  const TM_HUB = { x: 500, y: 288 };
  const TM_SRC = [
    { x: 500, y:  98, sys: true, g: 'db',   d: 0.20 },   // the single system (prominent, opens first)
    { x: 732, y: 185,            g: 'grid', d: 2.05 },
    { x: 732, y: 392,            g: 'web',  d: 2.20 },
    { x: 500, y: 470,            g: 'doc',  d: 2.35 },
    { x: 268, y: 392,            g: 'chat', d: 2.50 },
    { x: 268, y: 185,            g: 'cal',  d: 2.65 },
  ];
  // Generic, unnamed app glyphs (drawn in a ~14px local box).
  const TM_GLYPHS = {
    db:   '<ellipse cx="7" cy="2.6" rx="6.4" ry="2.4"/><path d="M0.6,2.6 V11 a6.4,2.4 0 0 0 12.8,0 V2.6"/><path d="M0.6,6.8 a6.4,2.4 0 0 0 12.8,0"/>',
    grid: '<rect x="0.6" y="0.6" width="12.8" height="12.8" rx="1.4"/><path d="M0.6,5 H13.4 M0.6,9 H13.4 M5,0.6 V13.4 M9,0.6 V13.4"/>',
    web:  '<rect x="0.6" y="1.4" width="12.8" height="11.2" rx="1.4"/><path d="M0.6,5 H13.4"/><circle cx="2.6" cy="3.2" r="0.5"/><circle cx="4.3" cy="3.2" r="0.5"/>',
    doc:  '<rect x="2.4" y="0.6" width="9.2" height="12.8" rx="1.2"/><path d="M4.4,4 H9.6 M4.4,6.6 H9.6 M4.4,9.2 H8"/>',
    chat: '<path d="M1,3 a2,2 0 0 1 2,-2 H11 a2,2 0 0 1 2,2 V8.4 a2,2 0 0 1 -2,2 H6.2 L3,13 V10.4 a2,2 0 0 1 -2,-2 z"/><path d="M4,5.6 H10 M4,7.8 H8"/>',
    cal:  '<rect x="0.7" y="1.6" width="12.6" height="11.7" rx="1.4"/><path d="M0.7,5 H13.3 M4,0.6 V3 M10,0.6 V3"/>',
  };
  const tmEdge = (from, to, dist) => {                   // a point `dist` px from `from` toward `to`
    const dx = to.x - from.x, dy = to.y - from.y, L = Math.hypot(dx, dy) || 1;
    return { x: from.x + dx / L * dist, y: from.y + dy / L * dist };
  };
  // One window (the system is larger, brighter and streams log rows like card 1).
  function tmWin(s) {
    const w = s.sys ? 150 : 124, h = s.sys ? 104 : 86;
    const x = s.x - w / 2, y = s.y - h / 2, barH = s.sys ? 24 : 22;
    const boxCls = s.sys ? 'tm-win-box tm-sys-box' : 'tm-win-box';
    let body;
    if (s.sys) {
      const ry = y + barH + 12;
      const rows = [[118, ry], [88, ry + 14], [118, ry + 28], [72, ry + 42]];
      body = rows.map((r, i) => `<rect class="tm-row" x="${x + 18}" y="${r[1]}" width="${r[0]}" height="7" rx="3" style="animation-delay:${(0.5 + i * 0.14).toFixed(2)}s"/>`).join('');
    } else {
      body = `<rect class="tm-win-line" x="${x + 16}" y="${y + barH + 12}" width="92" height="6" rx="3"/>`
           + `<rect class="tm-win-line" x="${x + 16}" y="${y + barH + 26}" width="58" height="6" rx="3"/>`
           + `<circle class="tm-win-dot" cx="${x + w - 14}" cy="${y + 11}" r="1.7"/><circle class="tm-win-dot" cx="${x + w - 22}" cy="${y + 11}" r="1.7"/>`;
    }
    return `<g class="tm-win" style="animation-delay:${s.d}s">
        <rect class="${boxCls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="9"/>
        <line class="tm-win-rule" x1="${x}" y1="${y + barH}" x2="${x + w}" y2="${y + barH}"/>
        <g class="tm-win-glyph" transform="translate(${x + 13},${y + (barH - 14) / 2})">${TM_GLYPHS[s.g]}</g>
        ${body}
      </g>`;
  }
  function buildTaskMining() {
    const W = [], RIM = [], GH = [], SP = [], FL = [];
    TM_SRC.forEach(s => W.push(tmWin(s)));
    // rim chords between neighbours = the hidden between-tool activity
    TM_SRC.forEach((s, i) => {
      const n = TM_SRC[(i + 1) % TM_SRC.length];
      const fwd = i % 2 === 0;                            // alternate direction for an organic feel
      const d = fwd ? `M${s.x},${s.y} L${n.x},${n.y}` : `M${n.x},${n.y} L${s.x},${s.y}`;
      RIM.push(`<path class="tm-rim" d="M${s.x},${s.y} L${n.x},${n.y}"/>`);
      GH.push(`<circle class="tm-ghost" r="3"><animateMotion dur="${(3.6 + i * 0.25).toFixed(2)}s" begin="${(i * 0.6).toFixed(2)}s" repeatCount="indefinite" path="${d}"/></circle>`);
    });
    // spokes inward + bright inflow = the capture into the central intelligence element
    TM_SRC.forEach((s, i) => {
      const p1 = tmEdge(s, TM_HUB, s.sys ? 58 : 48), p2 = tmEdge(TM_HUB, s, 44);
      const d = `M${p1.x.toFixed(1)},${p1.y.toFixed(1)} L${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
      SP.push(`<path class="tm-spoke" pathLength="1" style="animation-delay:${(6.8 + i * 0.15).toFixed(2)}s" d="${d}"/>`);
      FL.push(`<circle class="tm-flow" r="3.6"><animateMotion dur="2.2s" begin="${(i * 0.32).toFixed(2)}s" repeatCount="indefinite" path="${d}"/></circle>`);
    });
    const { x: hx, y: hy } = TM_HUB;
    const hub = `<g class="tm-hub">
        <circle class="tm-hub-glow" cx="${hx}" cy="${hy}" r="34"/>
        <circle class="tm-hub-ring" cx="${hx}" cy="${hy}" r="29"/>
        <circle class="tm-hub-spin" cx="${hx}" cy="${hy}" r="21"/>
        <circle class="tm-hub-coreglow" cx="${hx}" cy="${hy}" r="12"/>
        <circle class="tm-hub-core" cx="${hx}" cy="${hy}" r="8"/>
      </g>`;
    const sweep = `<circle class="tm-sweep" cx="${hx}" cy="${hy}" r="58"/>`;
    const labels = `<text class="tm-tag tm-syslabel" x="500" y="168" text-anchor="middle">SINGLE SYSTEM</text>`
                 + `<text class="tm-hubtag" x="${hx}" y="${hy + 54}" text-anchor="middle">CAPTURED</text>`;
    const scene = document.createElement('div');
    scene.className = 'tm-scene';
    scene.innerHTML = `<div class="tm-narrate"></div>
      <svg class="tm-svg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        ${SP.join('')}${RIM.join('')}
        <g class="tm-ghosts">${GH.join('')}</g>
        <g class="tm-flows">${FL.join('')}</g>
        ${hub}${sweep}
        ${W.join('')}${labels}
      </svg>`;
    return scene;
  }

  // ── Process Mining animation (data → the real process map) ──────
  // One SVG holds it all so the source panel, the graph and the labels share a
  // coordinate space (viewBox 1000×540). A single "System" panel streams its event
  // log; the records assemble into a clean flow; then the flow reveals its real
  // variation — an alternative path, a rework loop and a flared bottleneck. Token
  // dots keep flowing through so the finished map reads as live. The CSS cascade
  // (fired by .playing) runs the structural timeline; playPM() types the narration.
  // Spine the data tokens ride (system exit → end node), reused by all three tokens.
  const PM_SPINE = 'M190,270 L300,270 L450,270 L600,270 L750,270 L900,270';
  const pmTok = (begin) =>
    `<circle class="pm-tok" r="4.5"><animateMotion dur="3.4s" begin="${begin}s" repeatCount="indefinite" path="${PM_SPINE}"/></circle>`;
  const PROCESS_MINING = `
    <div class="pm-scene">
      <div class="pm-narrate"></div>
      <svg class="pm-svg" viewBox="0 0 1000 540" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <marker id="pmArrowWarm" markerWidth="9" markerHeight="9" refX="5.5" refY="4" orient="auto">
            <path d="M1,1 L6,4 L1,7" fill="none" stroke="#ffb24d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>

        <!-- ── source system: the single origin of all the data ── -->
        <g class="pm-sys">
          <rect class="pm-sys-box" x="34" y="176" width="150" height="190" rx="12"/>
          <line class="pm-sys-rule" x1="34" y1="208" x2="184" y2="208"/>
          <g class="pm-sys-glyph" transform="translate(48,182)">
            <ellipse cx="8" cy="3.4" rx="8" ry="3.2"/>
            <path d="M0,3.4 V12 a8,3.2 0 0 0 16,0 V3.4"/>
            <path d="M0,7.7 a8,3.2 0 0 0 16,0"/>
          </g>
          <text class="pm-sys-label" x="76" y="197">System</text>
          <rect class="pm-row" x="50" y="224" width="118" height="8" rx="3" style="animation-delay:0.60s"/>
          <rect class="pm-row" x="50" y="244" width="92"  height="8" rx="3" style="animation-delay:0.74s"/>

  // Placeholder slot — no title or copy, just a centred marker (swap in the real animation later).
  const placeholderSlot = () => `
    <div class="pi-slot">

  // ── Conversational Interface animation (the few → the many) ─────
  // Left 2/3: two "Data scientists" shrink away as a whole-organisation crowd pops in
  // ("Every team"). Right 1/3: broad, plain-English questions stream in and get answered.
  const CONVO_QUESTIONS = [
    'How can I reduce call handling time?',
    "Where's the bottleneck in onboarding?",
    "What's driving claims rework this quarter?",
    'Which process costs us the most?',
    'How do I speed up new-policy approvals?',
    'Where are customers dropping off?',
    "What's slowing down our invoicing?",
  ];
  const personSVG = () => '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.2" r="4"/><path d="M3.6 20.5c0-4.64 3.76-8 8.4-8s8.4 3.36 8.4 8z"/></svg>';

  function buildConvo() {
    const scene = document.createElement('div');
    scene.className = 'cv-scene';
    scene.innerHTML = `
      <div class="cv-people">
        <div class="cv-narrate"></div>
        <div class="cv-spotlight"></div>
        <div class="cv-crowd"></div>
      </div>
      <div class="cv-questions">
        <div class="cv-rtitle"></div>
        <div class="cv-qlist"></div>
      </div>
      <div class="cv-link-layer"></div>`;
    const crowd = scene.querySelector('.cv-crowd');
    // Seeded RNG → a stable, organic cloud (not a grid).
    let s = 20260607;
    const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    // Place points in an ellipse. AR corrects for the crowd box being wider than tall, so the
    // spacing test is roughly uniform in pixels (prevents vertical stacking / clipping).
    const N = 30, RX = 48, RY = 47, AR = 2.2, MIND = 10, pts = [];
    let guard = 0;
    while (pts.length < N && guard++ < 9000) {
      const x = 50 + (rnd() * 2 - 1) * RX;
      const y = 50 + (rnd() * 2 - 1) * RY;
      if (((x - 50) / RX) ** 2 + ((y - 50) / RY) ** 2 > 1) continue;     // inside an ellipse
      if (pts.some(p => Math.hypot(p.x - x, (p.y - y) / AR) < MIND)) continue;   // aspect-aware spacing
      pts.push({ x, y });
    }
    // Two experts = the points nearest the centre (so they sit in the heart of the crowd).
    pts.sort((a, b) => Math.hypot(a.x - 50, a.y - 50) - Math.hypot(b.x - 50, b.y - 50));

    // Constellation: faint links from each person to its 1–2 nearest neighbours (behind the crowd).
    const NS = 'http://www.w3.org/2000/svg';
    const net = document.createElementNS(NS, 'svg');
    net.setAttribute('class', 'cv-net'); net.setAttribute('viewBox', '0 0 100 100'); net.setAttribute('preserveAspectRatio', 'none');
    const seen = new Set();
    pts.forEach((p, i) => {
      pts.map((q, j) => ({ j, d: Math.hypot(p.x - q.x, (p.y - q.y) / AR) }))
        .filter(o => o.j !== i).sort((a, b) => a.d - b.d).slice(0, 2)
        .forEach(o => {
          if (o.d > 24) return;
          const key = i < o.j ? i + '-' + o.j : o.j + '-' + i; if (seen.has(key)) return; seen.add(key);
          const ln = document.createElementNS(NS, 'line');
          ln.setAttribute('x1', p.x); ln.setAttribute('y1', p.y);
          ln.setAttribute('x2', pts[o.j].x); ln.setAttribute('y2', pts[o.j].y);
          net.appendChild(ln);
        });
    });
    crowd.appendChild(net);

    // People — with per-person depth (size, brightness, float amplitude/speed) so it reads as a
    // real crowd rather than a flat grid.
    pts.forEach((p, i) => {
      const isExpert = i < 2;
      const el = document.createElement('span');
      el.className = isExpert ? 'cv-hero-ic' : 'cv-dot';
      el.style.left = p.x + '%';
      el.style.top = p.y + '%';
      el.innerHTML = personSVG();
      if (!isExpert) {
        const dz = rnd();                                                  // 0 = back, 1 = front
        el.style.width = (8 + dz * 4.5).toFixed(1) + '%';                  // 8%..12.5% (slightly larger)
        el.style.color = 'rgba(205,214,225,' + (0.4 + dz * 0.5).toFixed(2) + ')';   // dimmer at the back
        el.style.zIndex = String(1 + Math.round(dz * 8));
        el.style.setProperty('--i', i);
        el.style.setProperty('--amp', (4 + dz * 8).toFixed(1) + 'px');     // bob amplitude grows toward the front
        el.style.setProperty('--d', (rnd() * 1.4).toFixed(2));
        el.querySelector('svg').style.animationDuration = (3.6 - dz * 0.9).toFixed(2) + 's';
      }
      crowd.appendChild(el);
    });
    return scene;
  }

  // ════════════ Shared helpers for cards 3–6 ════════════
  // Each scene keeps its pending timers on scene._t; cardPlay resets + re-fires the
  // CSS timeline, cardStop tears it down. cardType is the common narration typer,
  // cardCount animates a number into an element. All three guard against a torn-down
  // scene so a stale timeout can never write to a stopped card.
  function cardPlay(scene) {
    if (scene._t) scene._t.forEach(clearTimeout);
    scene._t = [];
    const nar = scene.querySelector('.pi-narr'); if (nar) { nar.classList.remove('wipe'); nar.innerHTML = ''; }
    scene.classList.remove('playing'); void scene.offsetWidth; scene.classList.add('playing');
  }
  function cardStop(scene) {
    if (scene._t) { scene._t.forEach(clearTimeout); scene._t = null; }
    const nar = scene.querySelector('.pi-narr'); if (nar) { nar.classList.remove('wipe'); nar.innerHTML = ''; }
    scene.classList.remove('playing');

  function cardType(scene, host, segments, cps, delay) {
    const run = () => {
      host.innerHTML = '';
      const spans = segments.map(s => { const e = document.createElement('span'); if (s.hl) e.className = 'pi-hl'; host.appendChild(e); return e; });
      if (reduceMotion()) { spans.forEach((e, i) => e.textContent = segments[i].t); return; }
      const caret = document.createElement('span'); caret.className = 'pi-caret'; host.appendChild(caret);
      let si = 0, ci = 0;
      const stepFn = () => {
        if (si >= segments.length) { caret.remove(); return; }
        const seg = segments[si];
        if (ci < seg.t.length) spans[si].textContent += seg.t[ci++]; else { si++; ci = 0; }
        if (scene._t) scene._t.push(setTimeout(stepFn, cps));
      };
      stepFn();
    };
    if (scene._t) scene._t.push(setTimeout(run, delay));
  }
  function cardCount(scene, el, to, dur, delay, fmt, from) {
    if (!el) return;
    from = from || 0;
    const start = () => {
      if (reduceMotion()) { el.textContent = fmt(to); return; }
      const N = Math.max(12, Math.round(dur / 40)); let i = 0;
      const tick = () => {
        i++; const p = i / N, e = 1 - Math.pow(1 - p, 3);
        el.textContent = fmt(from + (to - from) * e);
        if (i < N) { if (scene._t) scene._t.push(setTimeout(tick, dur / N)); } else el.textContent = fmt(to);
      };
      tick();
    };
    if (scene._t) scene._t.push(setTimeout(start, delay));
  }

  // Crowd → question pulse: a small token travels from a random person to a new question bubble.
  const NS_SVG = 'http://www.w3.org/2000/svg';
  function firePulse(scene, bubbleEl) {
    if (reduceMotion()) return;
    const layer = scene.querySelector('.cv-link-layer'); if (!layer) return;
    const dots = scene.querySelectorAll('.cv-dot'); if (!dots.length) return;
    const lr = layer.getBoundingClientRect(); if (!lr.width) return;
    const dotEl = dots[Math.floor(Math.random() * dots.length)];
    const src = dotEl.getBoundingClientRect();
    const br = bubbleEl.getBoundingClientRect();
    const x1 = src.left + src.width / 2 - lr.left, y1 = src.top + src.height / 2 - lr.top;
    const x2 = br.left - lr.left + 6, y2 = br.top + br.height / 2 - lr.top;
    // Static guide line (plain SVG, no animation).
    const d = `M ${x1} ${y1} C ${(x1 + x2) / 2} ${y1}, ${(x1 + x2) / 2} ${y2}, ${x2} ${y2}`;
    const svg = document.createElementNS(NS_SVG, 'svg');
    svg.setAttribute('class', 'cv-pulse-svg'); svg.setAttribute('viewBox', `0 0 ${lr.width} ${lr.height}`); svg.setAttribute('preserveAspectRatio', 'none');
    const path = document.createElementNS(NS_SVG, 'path'); path.setAttribute('d', d); path.setAttribute('class', 'cv-pulse-line');
    svg.appendChild(path); layer.appendChild(svg);

    // Moving token + halo — driven by the Web Animations API. Sample the SAME cubic bezier
    // as the guide line above so the token rides exactly on the dashed line (no SMIL).
    const P = [[x1, y1], [(x1 + x2) / 2, y1], [(x1 + x2) / 2, y2], [x2, y2]];
    const frames = [];
    const STEPS_N = 24;
    for (let i = 0; i <= STEPS_N; i++) {
      const t = i / STEPS_N, u = 1 - t;
      const bx = u * u * u * P[0][0] + 3 * u * u * t * P[1][0] + 3 * u * t * t * P[2][0] + t * t * t * P[3][0];
      const by = u * u * u * P[0][1] + 3 * u * u * t * P[1][1] + 3 * u * t * t * P[2][1] + t * t * t * P[3][1];
      const op = t < 0.15 ? t / 0.15 : t > 0.85 ? (1 - t) / 0.15 : 1;
      frames.push({ transform: `translate(${bx.toFixed(1)}px, ${by.toFixed(1)}px)`, opacity: op, offset: t });
    }
    const opts = { duration: 1400, easing: 'linear', fill: 'forwards' };
    const halo = document.createElement('div'); halo.className = 'cv-pulse-halo'; layer.appendChild(halo);
    const tok = document.createElement('div'); tok.className = 'cv-pulse-token'; layer.appendChild(tok);
    if (halo.animate) { halo.animate(frames, opts); tok.animate(frames, opts); }

    dotEl.classList.add('asking');                  // the asker lights up cyan as the question flies
    const tm = scene._cvTimers || (scene._cvTimers = []);
    tm.push(setTimeout(() => dotEl.classList.remove('asking'), 1000));
    tm.push(setTimeout(() => { svg.style.opacity = '0'; }, 1500));
    tm.push(setTimeout(() => { svg.remove(); halo.remove(); tok.remove(); }, 2050));
  }

    const narrate = scene.querySelector('.cv-narrate'); if (narrate) { narrate.classList.remove('wipe'); narrate.innerHTML = ''; }
    const rtitle = scene.querySelector('.cv-rtitle'); if (rtitle) rtitle.innerHTML = '';
    const layer = scene.querySelector('.cv-link-layer'); if (layer) layer.innerHTML = '';
    scene.classList.remove('playing', 'experts', 'revealed');
  }

  function showBig(n) {
    const next = (n >= 1 && n <= STEPS) ? bigs[n - 1] : null;
    if (next === currentBig) return;
    const prev = currentBig;
    currentBig = next;
    if (swapTimer) { clearTimeout(swapTimer); swapTimer = null; }
    if (prev) {
      prev.classList.remove('active'); prev.classList.add('closing');
      stopScene(prev);                                        // halt timers + reset the leaving card
    }
    const delay = prev ? 280 : 0;           // close the last card, then raise the new one
    swapTimer = setTimeout(() => {
      if (prev) prev.classList.remove('closing');
      if (next) {
        next.classList.add('active');
        playScene(next);
      }
    }, delay);
  }

  // Replay the animation in the currently-open card (driven by the in-iframe replay
  // button and the deck's replay button via the 'replay' message).
  function replayCurrent() {
    const el = currentBig; if (!el) return;
    playScene(el);
  }

  function render() {
    // rail + pillar highlight
    railCards.forEach((c, i) => {
      c.classList.toggle('active', step === i + 1);
      c.classList.toggle('done', step > i + 1);
    });
    pillar.classList.toggle('active', step === STEPS);

    // big card / intro
    showBig(step);
    intro.classList.toggle('show', step === 0);

    // caption: set the sub text, then bounce eyebrow + title + sub together
    capSub.innerHTML = step === 0
      ? 'Six layers of process intelligence &mdash; underpinned by a conversational interface anyone can use.'
      : ALL[step - 1].sub;
    const capEls = [capEyebrow, capTitle, capSub];
    capEls.forEach(el => el.classList.remove('cap-bounce'));
    void capTitle.offsetWidth;                 // single reflow to re-fire the animation
    capEls.forEach(el => el.classList.add('cap-bounce'));

    // progress
    dots.forEach((d, i) => { d.classList.toggle('on', step === i + 1); d.classList.toggle('done', step > i + 1); });
    progLabel.textContent = step === 0 ? 'Overview' : ALL[step - 1].name;
    navCount.textContent = step + ' / ' + STEPS;
    btnPrev.disabled = step === 0;
    btnNext.disabled = step === STEPS;
  }

  function goTo(n) {
    n = Math.max(0, Math.min(STEPS, n));
    if (n === step) return;
    step = n;
    render();
  }

  btnPrev.addEventListener('click', () => goTo(step - 1));
  btnNext.addEventListener('click', () => goTo(step + 1));
  btnReplay.addEventListener('click', replayCurrent);

  // ── Keyboard + deck bridge ─────────────────────────────────────
  // Embedded in the deck (foundation.html), this file OWNS its own step sequence. The deck
  // sends intent only — deck-enter / deck-advance / deck-reverse — and we reply deck-next /
  // deck-prev when stepping past the first/last step so the deck changes slides. Because the
  // step count lives here, layers can be added/removed without touching the deck.
  const embedded = window.parent !== window;
  const toParent = (msg) => { try { window.parent.postMessage(msg, '*'); } catch (err) {} };
  const isArrowKey = k => k === 'ArrowRight' || k === 'ArrowLeft' || k === 'ArrowDown' || k === 'ArrowUp';
  const isFwdKey   = k => k === 'ArrowRight' || k === 'ArrowDown';

  function stepForward()  { if (step < STEPS) goTo(step + 1); else if (embedded) toParent({ type: 'deck-next' }); }
  function stepBackward() { if (step > 0)     goTo(step - 1); else if (embedded) toParent({ type: 'deck-prev' }); }

  // Local arrow keys — used standalone, and when the iframe itself holds focus inside the deck.
  window.addEventListener('keydown', (e) => {
    if (!isArrowKey(e.key)) return;
    e.preventDefault();
    isFwdKey(e.key) ? stepForward() : stepBackward();
  });

  // Parent → iframe messages (the deck's embed handshake):
  window.addEventListener('message', (e) => {
    if (!e.data) return;
    switch (e.data.type) {
      // Entered the slide (fwd/reverse). Set the step and ALWAYS render so the title
      // bounces on entry too — goTo() would no-op if the step index is unchanged.
      case 'deck-enter':       step = (e.data.dir === 'rev') ? STEPS : 0; render(); break;
      case 'deck-advance':     stepForward();  break;
      case 'deck-reverse':     stepBackward(); break;
      case 'replay':           replayCurrent(); break;     // deck replay button
      case 'slide-activated':  step = 0; render(); break;  // legacy reset hook
    }
  });

  // ── Boot ───────────────────────────────────────────────────────
  render();
  // Tell the deck we're ready so it can (re)send deck-enter if it navigated here before load.
  if (embedded) toParent({ type: 'embed-ready' });
})();
</script>
</body>
</html>
